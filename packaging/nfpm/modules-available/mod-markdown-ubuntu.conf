# Ubuntu-native module snippet.
#
# The package installs this file into /usr/share/nginx/modules-available and
# links it into /etc/nginx/modules-enabled, which the Ubuntu nginx.conf
# includes at the main context. The module registers its directives with
# markdown_filter defaulting to off, so loading the module does not change
# how an existing configuration handles requests.
load_module modules/ngx_http_markdown_filter_module.so;
