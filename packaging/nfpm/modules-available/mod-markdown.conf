# mod-markdown.conf — nginx-markdown-for-agents dynamic module (DEB family)
#
# This module enables HTML-to-Markdown conversion for AI agent requests.
#
# The file is installed under /usr/share/nginx/modules-available/; NGINX does
# not read that directory by itself, so loading the module stays an explicit
# operator decision:
#
#   sudo ln -sf /usr/share/nginx/modules-available/mod-markdown.conf \
#       /etc/nginx/modules-enabled/50-mod-markdown.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# NGINX best practice for dynamic modules:
#   * load_module belongs in the MAIN context — the top level of nginx.conf,
#     before the events and http blocks.  It is not valid inside http, server,
#     or location, and conf.d/ files are the wrong place for it.  Debian's
#     nginx.conf includes /etc/nginx/modules-enabled/*.conf at the top level
#     precisely so this file lands in the main context.
#   * A relative module path in load_module is resolved against the NGINX
#     prefix, not against --modules-path.  This package ships the module only
#     in the compiled --modules-path (/usr/lib/nginx/modules), so the absolute
#     path below is the form that works on every layout.  (Distribution
#     packages such as libnginx-mod-* also populate the prefix-relative
#     directory, which is why their snippets can use the relative form.)
#   * Inspect the paths on your host with:
#       nginx -V 2>&1 | tr ' ' '\n' | grep -E 'modules-path|prefix='
#
# Confirm the module is loaded after reloading:
#   sudo nginx -T 2>&1 | grep -E '^[[:space:]]*load_module[[:space:]]+[^;]*ngx_http_markdown_filter_module\.so'
#
# The module only converts responses in locations that opt in:
#     location / { markdown_filter on; }
#
load_module /usr/lib/nginx/modules/ngx_http_markdown_filter_module.so;
