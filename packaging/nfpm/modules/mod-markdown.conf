# mod-markdown.conf — nginx-markdown-for-agents dynamic module (RPM family)
#
# Installed to /usr/share/nginx/modules/ as a READY-TO-USE reference drop-in.
# Current nginx.org RPM packages do NOT include that directory automatically:
# their nginx.conf expects the operator to enable a dynamic module with a
# load_module directive (see
# https://docs.nginx.com/nginx/admin-guide/installing-nginx/installing-nginx-open-source/).
# Some layouts do include /usr/share/nginx/modules/*.conf from the top level,
# which is why the shipped directive stays commented out — no include
# mechanism may load a third-party module into a running NGINX without an
# explicit operator decision.
#
# NGINX best practice for dynamic modules:
#   * load_module belongs in the MAIN context — the top level of nginx.conf,
#     before the events and http blocks.  It must not appear inside http,
#     server, or location, and it is not valid in conf.d/ files.
#   * A relative module path in load_module is resolved against the NGINX
#     prefix.  nginx.org packages make that work by shipping
#     /etc/nginx/modules as a symlink to the compiled --modules-path
#     (/usr/lib64/nginx/modules), so the relative form below resolves to this
#     package's module.  The absolute path works equally well; inspect your
#     host with:
#       nginx -V 2>&1 | tr ' ' '\n' | grep -E 'modules-path|prefix='
#
# Enable the module — pick ONE of these:
#
#   A. Paste the directive into the top level of /etc/nginx/nginx.conf
#      (before the events block), then:
#        sudo nginx -t && sudo systemctl reload nginx
#
#   B. Keep this file as the source of truth: uncomment the load_module line
#      below and include the directory from the top level of nginx.conf:
#        # in nginx.conf, before events {}
#        include /usr/share/nginx/modules/*.conf;
#      then: sudo nginx -t && sudo systemctl reload nginx
#
# Confirm the module is loaded after reloading:
#   sudo nginx -T 2>&1 | grep -E '^[[:space:]]*load_module[[:space:]]+[^;]*ngx_http_markdown_filter_module\.so'
#
# The module only converts responses in locations that opt in:
#     location / { markdown_filter on; }
#
#load_module modules/ngx_http_markdown_filter_module.so;
