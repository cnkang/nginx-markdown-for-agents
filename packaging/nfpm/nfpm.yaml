# packaging/nfpm/nfpm.yaml
#
# nFPM declarative packaging configuration for nginx-module-markdown-for-agents.
# Generates both .deb and .rpm packages from pre-built Module_SO artifacts.
#
# Environment variables (injected by workflow matrix):
#   PKG_VERSION          - Project version (e.g. 0.8.2)
#   NGINX_VERSION        - Target NGINX version (e.g. 1.26.3)
#   NGINX_VERSION_CEIL   - Upper NGINX version bound for the dependency range
#   RPM_NGINX_EVR        - RPM dependency epoch/version/release (e.g. 1:1.26.3)
#   NFPM_ARCH            - Target architecture (e.g. amd64, arm64)
#
# Usage:
#   nfpm package --packager deb --target "dist/${DEB_FILENAME}"
#   nfpm package --packager rpm --target "dist/${RPM_FILENAME}"
#
# ABI safety:
#   NGINX dynamic modules require ABI compatibility with the EXACT NGINX
#   version they were compiled against; the core loader rejects any
#   version difference (including patch) before signature checks.
#   RPM dependency metadata pins the exact NGINX version. Debian package
#   revisions are distribution-specific, so its dependency uses a closed
#   interval (the pinned lower bound plus an exclusive next-patch ceiling),
#   while the preinstall script enforces the exact version at install time.

name: "nginx-module-markdown-for-agents"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "${PKG_VERSION}"
release: "nginx${NGINX_VERSION}"
maintainer: "nginx-markdown-for-agents maintainers"
description: |
  NGINX dynamic module for HTML-to-Markdown conversion.
  Compiled for NGINX ${NGINX_VERSION}. Requires EXACTLY this NGINX version.
  Serves Markdown to AI agents via content negotiation.
vendor: "NGINX Markdown for Agents Contributors"
homepage: "https://github.com/cnkang/nginx-markdown-for-agents"
license: "BSD-2-Clause"

overrides:
  deb:
    depends:
      - "nginx (>= ${NGINX_VERSION})"
      - "nginx (<< ${NGINX_VERSION_CEIL})"
      - "libbrotli1"
  rpm:
    depends:
      - "nginx = ${RPM_NGINX_EVR}"
      - "libbrotli"

contents:
  - src: "./build/ngx_http_markdown_filter_module.so"
    dst: "/usr/lib/nginx/modules/ngx_http_markdown_filter_module.so"
    packager: deb
    file_info:
      mode: 0644

  - src: "./build/ngx_http_markdown_filter_module.so"
    dst: "/usr/lib64/nginx/modules/ngx_http_markdown_filter_module.so"
    packager: rpm
    file_info:
      mode: 0644

  - src: "./packaging/nfpm/modules-available/mod-markdown.conf"
    dst: "/usr/share/nginx/modules-available/mod-markdown.conf"
    type: config|noreplace
    packager: deb

  - src: "./LICENSE"
    dst: "/usr/share/licenses/nginx-markdown-for-agents/LICENSE"

  - src: "./packaging/docs/README.md"
    dst: "/usr/share/doc/nginx-markdown-for-agents/README.md"

  - src: "./docs/guides/INSTALLATION.md"
    dst: "/usr/share/doc/nginx-markdown-for-agents/INSTALLATION.md"

  - src: "./docs/guides/INSTALL.md"
    dst: "/usr/share/doc/nginx-markdown-for-agents/INSTALL.md"

  - src: "./docs/guides/PACKAGE_INSTALLATION.md"
    dst: "/usr/share/doc/nginx-markdown-for-agents/PACKAGE_INSTALLATION.md"

  - src: "./docs/guides/PACKAGE_COMPATIBILITY.md"
    dst: "/usr/share/doc/nginx-markdown-for-agents/PACKAGE_COMPATIBILITY.md"

scripts:
  preinstall: "./packaging/nfpm/scripts/preinstall.sh"
  postinstall: "./packaging/nfpm/scripts/postinstall.sh"
  preremove: "./packaging/nfpm/scripts/preremove.sh"
