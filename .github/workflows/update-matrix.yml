name: Update Release Matrix

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: matrix-auto-update
  cancel-in-progress: false

jobs:
  update-matrix:
    name: Prepare release matrix update
    # Only the protected default branch may run repository update code.  This
    # job has no write token; the separate trusted job applies its artifact.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Run matrix updater
        run: python3 tools/release/matrix/update_matrix.py

      - name: Generate release-contract matrix projection
        run: python3 tools/release/matrix/generate_release_contract_matrix.py --write

      - name: Render release matrix docs
        run: python3 tools/render_release_matrix_docs.py --write

      - name: Check and constrain generated changes
        id: changes
        run: |
          set -euo pipefail
          allowed_files=$'tools/release-matrix.json\ndocs/releases/release-matrix.json\ndocs/guides/INSTALLATION.md'
          changed_files="$(git diff --name-only)"
          if [[ -n "$changed_files" ]]; then
            while IFS= read -r path; do
              if [[ "$allowed_files" != *$'\n'"$path"$'\n'* &&
                "$path" != "${allowed_files%%$'\n'*}" &&
                "$path" != "${allowed_files##*$'\n'}" ]]; then
                echo "unexpected generated path: $path" >&2
                exit 1
              fi
            done <<< "$changed_files"
          fi
          if [[ -n "$changed_files" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run validation scripts
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python3 tools/release/matrix/generate_release_contract_matrix.py --check
          PYTHONPATH=. python3 tools/release/matrix/validate_release_matrix.py
          python3 tools/release/matrix/validate_doc_matrix_sync.py
          python3 tools/release/matrix/validate_matrix_install_consistency.py
          python3 tools/release/matrix/validate_workflow_matrix_consumers.py

      - name: Build PR metadata
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os

          diff_path = "tools/matrix-diff.json"
          if os.path.exists(diff_path):
              with open(diff_path, "r", encoding="utf-8") as f:
                  diff = json.load(f)
          else:
              diff = {}

          added = diff.get("added_versions", [])
          removed = diff.get("removed_versions", [])
          parts = []
          if added:
              parts.append("add " + ", ".join(added))
          if removed:
              parts.append("remove " + ", ".join(removed))
          if not parts:
              parts.append("update matrix entries")

          with open("pr-title.txt", "w", encoding="utf-8") as f:
              f.write("chore: update nginx release matrix (" +
                      "; ".join(parts) + ")\n")

          body_lines = [
              "Automated update of the nginx release matrix.",
              "",
              "Source: nginx.org download page.",
              "",
          ]
          if added:
              body_lines.append("### Added versions")
              body_lines.extend(f"- `{version}`" for version in added)
              body_lines.append("")
          if removed:
              body_lines.append("### Removed versions")
              body_lines.extend(f"- `{version}`" for version in removed)
              body_lines.append("")
          if not added and not removed:
              body_lines.append(
                  "Entry-level changes detected (platform or tier adjustments, "
                  "no version additions/removals)."
              )
              body_lines.append("")

          with open("pr-body.md", "w", encoding="utf-8") as f:
              f.write("\n".join(body_lines))
          PY

      - name: Create review artifact
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git diff --binary -- \
            tools/release-matrix.json \
            docs/releases/release-matrix.json \
            docs/guides/INSTALLATION.md > matrix-update.patch
          git diff --check

      - name: Upload review artifact
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-matrix-update
          path: |
            matrix-update.patch
            pr-title.txt
            pr-body.md
          if-no-files-found: error
          retention-days: 7

  create-matrix-pr:
    name: Create release matrix pull request
    needs: update-matrix
    if: needs.update-matrix.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download review artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-matrix-update

      - name: Apply and verify review artifact
        run: |
          set -euo pipefail
          git apply --check matrix-update.patch
          git apply matrix-update.patch
          git diff --check
          allowed_files=$'tools/release-matrix.json\ndocs/releases/release-matrix.json\ndocs/guides/INSTALLATION.md'
          changed_files="$(git diff --name-only)"
          while IFS= read -r path; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$allowed_files" != *$'\n'"$path"$'\n'* &&
              "$path" != "${allowed_files%%$'\n'*}" &&
              "$path" != "${allowed_files##*$'\n'}" ]]; then
              echo "unexpected artifact path: $path" >&2
              exit 1
            fi
          done <<< "$changed_files"

      - name: Read PR metadata
        id: pr_meta
        run: |
          {
            echo 'title<<EOF_PR_TITLE'
            cat pr-title.txt
            echo 'EOF_PR_TITLE'
            echo 'body<<EOF_PR_BODY'
            cat pr-body.md
            echo 'EOF_PR_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Pull Request
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: auto/update-matrix
          title: ${{ steps.pr_meta.outputs.title }}
          body: ${{ steps.pr_meta.outputs.body }}
          labels: |
            automated
            release-matrix
          commit-message: ${{ steps.pr_meta.outputs.title }}

      - name: Report manual PR fallback
        if: steps.create_pr.outcome == 'failure'
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          echo "::warning::Matrix update branch pushed, but automatic PR creation is blocked."
          echo "::warning::Open ${REPO_URL}/pull/new/auto/update-matrix to finish the update manually."

      - name: Remind maintainer review for release matrix PR
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          echo "Release matrix PR #$PR_NUMBER created."
          echo "A maintainer must review and merge this PR before the matrix update takes effect."
          echo "::notice::PR #$PR_NUMBER is ready for review and manual merge."
