name: Release Binaries

on:
  # Musl dynamic-module tarballs are now built BEFORE publication by
  # release-packages.yml (musl-build job, tag + workflow_dispatch triggers).
  # This workflow remains as a manual rebuild tool for existing releases;
  # it never runs on release publication (F-01 fix: supported musl artifacts
  # must exist before the release goes public).
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release tag to publish, or any ref for build-only (e.g. v1.0.0 or main)'
        required: false
        default: ''

permissions: {}

# Release integrity:
#   - Every dynamic-module archive is listed in SHA256SUMS.
#   - Published releases additionally carry SHA256SUMS.asc, signed in the
#     protected release-signing environment.

jobs:
  prepare:
    name: Resolve Build Matrix from release-matrix.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix_entries: ${{ steps.resolve.outputs.matrix_entries }}
      checkout_ref: ${{ steps.checkout_ref.outputs.checkout_ref }}
      publication_tag: ${{ steps.validate_ref.outputs.publication_tag }}
    steps:
      - name: Validate requested ref
        id: validate_ref
        env:
          INPUT_VERSION: ${{ github.event_name == 'release' && github.ref_name || github.event.inputs.version || '' }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          # Build-only dispatches may use a safe branch or commit ref.  Only an
          # exact stable release tag is eligible for signing and publication.
          checkout_ref="${DEFAULT_REF}"
          publication_tag=""
          if [[ -n "${INPUT_VERSION}" ]]; then
            if [[ "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              checkout_ref="refs/tags/${INPUT_VERSION}"
              publication_tag="${INPUT_VERSION}"
            elif printf '%s' "${INPUT_VERSION}" | grep -qE '^[A-Za-z0-9._/-]+$' \
              && [[ "${INPUT_VERSION}" != -* ]] \
              && [[ "${INPUT_VERSION}" != */ ]] \
              && [[ "${INPUT_VERSION}" != /* ]] \
              && [[ "${INPUT_VERSION}" != *..* ]]; then
              checkout_ref="${INPUT_VERSION}"
            else
              echo "ERROR: version must be a stable vX.Y.Z tag or a safe build-only ref." >&2
              exit 1
            fi
          fi
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "publication_tag=${publication_tag}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_ref.outputs.checkout_ref }}

      - name: Verify publication tag binding
        if: steps.validate_ref.outputs.publication_tag != ''
        env:
          PUBLICATION_TAG: ${{ steps.validate_ref.outputs.publication_tag }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${PUBLICATION_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD^{commit})"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "ERROR: publication tag does not resolve to the prepared commit." >&2
            exit 1
          fi
          echo "Verified ${PUBLICATION_TAG} at ${head_commit}"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Validate release matrix consumers
        run: |
          python3 tools/release/matrix/validate_workflow_matrix_consumers.py

      - name: Extract build matrix from release-matrix.json
        id: resolve
        run: |
          # Read release-binaries-owned supported entries from the checked-in
          # release matrix and output them for matrix.include consumption.
          python3 - <<'PY'
          import json, os

          with open("tools/release-matrix.json", "r") as f:
              data = json.load(f)

          def normalize_arch(arch):
              return {
                  "amd64": "x86_64",
                  "arm64": "aarch64",
              }.get(arch, arch)

          owner = ".github/workflows/release-binaries.yml"
          entries = [
              {
                  "nginx": e["nginx_version"],
                  "os_type": e["libc"],
                  "arch": normalize_arch(e["arch"]),
                  "support_tier": e["support_tier"],
              }
              for e in data.get("entries", [])
              if e.get("owner_workflow") == owner
              and e.get("support_tier") == "supported"
              and e.get("artifact_type") == "dynamic-module"
              and e.get("libc") in {"glibc", "musl"}
          ]

          if not entries:
              raise SystemExit(
                  "No supported release-binaries entries found in release-matrix.json"
              )

          # Sort for deterministic ordering
          entries.sort(key=lambda e: (
              tuple(int(p) for p in e["nginx"].split(".")),
              e["os_type"],
              e["arch"],
          ))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix_entries={json.dumps(entries)}\n")

          print(f"Resolved {len(entries)} build entries from release-matrix.json")
          PY

      - id: checkout_ref
        run: |
          # The prepare checkout resolves the requested tag/branch once; all
          # downstream jobs consume the resulting immutable commit SHA.
          echo "checkout_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build - NGINX ${{ matrix.nginx }} - ${{ matrix.os_type }} - ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix_entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Module
        run: |
          ./tools/build_release.sh ${{ matrix.nginx }} ${{ matrix.os_type }} ${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ngx_http_markdown_filter_module-${{ matrix.nginx }}-${{ matrix.os_type }}-${{ matrix.arch }}
          path: dist/${{ matrix.nginx }}-${{ matrix.os_type }}-${{ matrix.arch }}/*.tar.gz

  completeness-check:
    name: Verify Artifact Completeness
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Collect artifact filenames for completeness check
        run: |
          # download-artifact creates subdirectories per artifact name;
          # flatten all .tar.gz filenames into a list for the checker.
          find artifacts -name '*.tar.gz' -printf '%f\n' | sort > artifact-list.txt
          echo "Collected artifacts:"
          cat artifact-list.txt

      - name: Run completeness check
        run: |
          python3 tools/release/matrix/completeness_check.py \
            --matrix tools/release-matrix.json \
            --artifacts artifact-list.txt

  integrity-checksums:
    name: Generate Binary Checksums
    needs: [prepare, completeness-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ngx_http_markdown_filter_module-*
          path: artifacts
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        run: |
          ./packaging/scripts/generate-checksums.sh -d artifacts/
          (cd artifacts && sha256sum --check SHA256SUMS)
        shell: bash

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 5

  integrity-signing:
    name: Sign Binary Checksums
    needs: [prepare, integrity-checksums]
    if: >-
      needs.prepare.outputs.publication_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release-signing
    steps:
      - name: Preflight - validate GPG secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          MISSING=()
          [[ -z "${GPG_PRIVATE_KEY}" ]] && MISSING+=("GPG_PRIVATE_KEY")
          [[ -z "${GPG_PASSPHRASE}" ]] && MISSING+=("GPG_PASSPHRASE")
          [[ -z "${GPG_KEY_ID}" ]] && MISSING+=("GPG_KEY_ID")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: Missing required GPG secrets in 'release-signing' environment:" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            exit 1
          fi
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Download SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-checksums
          path: artifacts

      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          ./packaging/scripts/gpg-sign-checksums.sh artifacts/SHA256SUMS "${GPG_KEY_ID}"
        shell: bash

      - name: Upload SHA256SUMS.asc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-checksums-signature
          path: artifacts/SHA256SUMS.asc
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: Publish Binaries to Release
    needs: [prepare, completeness-check, integrity-checksums, integrity-signing]
    runs-on: ubuntu-latest
    if: >-
      always()
      && needs.completeness-check.result == 'success'
      && needs.integrity-checksums.result == 'success'
      && needs.integrity-signing.result == 'success'
      && needs.prepare.outputs.publication_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Download SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-checksums
          path: release-assets

      - name: Download SHA256SUMS.asc
        if: needs.prepare.outputs.publication_tag != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-checksums-signature
          path: release-assets

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Generate Grouped Version Manifest
        run: |
          python3 - <<'PY'
          import datetime
          import glob
          import json
          import os
          import re

          paths = glob.glob("artifacts/**/*.tar.gz", recursive=True)
          pattern = re.compile(
              r"ngx_http_markdown_filter_module-([0-9]+\.[0-9]+\.[0-9]+)-(glibc|musl)-(x86_64|aarch64)\.tar\.gz$"
          )

          by_series = {}
          for path in paths:
              name = os.path.basename(path)
              match = pattern.match(name)
              if not match:
                  continue
              version, os_type, arch = match.groups()
              series = ".".join(version.split(".")[:2])

              series_entry = by_series.setdefault(series, {"versions": {}, "latest": None})
              version_entry = series_entry["versions"].setdefault(version, [])
              target = f"{os_type}/{arch}"
              if target not in version_entry:
                  version_entry.append(target)

              if series_entry["latest"] is None:
                  series_entry["latest"] = version
              else:
                  current = tuple(int(p) for p in series_entry["latest"].split("."))
                  candidate = tuple(int(p) for p in version.split("."))
                  if candidate > current:
                      series_entry["latest"] = version

          for series in by_series.values():
              for version in series["versions"].values():
                  version.sort()

          grouped = {
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "series": dict(
                  sorted(
                      by_series.items(),
                      key=lambda item: tuple(int(p) for p in item[0].split(".")),
                  )
              ),
          }

          with open("artifacts/nginx-version-groups.json", "w", encoding="utf-8") as f:
              json.dump(grouped, f, indent=2, sort_keys=False)
              f.write("\n")

          lines = [
              "# NGINX Binary Version Groups",
              "",
              "Assets are grouped by major.minor for readability.",
              "Dynamic-module compatibility still requires exact patch matching.",
              "",
          ]
          for series, data in grouped["series"].items():
              lines.append(f"## {series}.x (latest: {data['latest']})")
              for version in sorted(
                  data["versions"].keys(),
                  key=lambda v: tuple(int(p) for p in v.split(".")),
              ):
                  targets = ", ".join(data["versions"][version])
                  lines.append(f"- `{version}` -> {targets}")
              lines.append("")

          with open("artifacts/nginx-version-groups.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          PY

      - name: Upload Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.publication_tag }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/nginx-version-groups.json
            artifacts/nginx-version-groups.md
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.asc
