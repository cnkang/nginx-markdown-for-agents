name: Real NGINX IMS Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "components/nginx-module/**"
      - "components/rust-converter/**"
      - "tools/ci/verify_real_nginx_ims.sh"
      - "tools/c-extract/extract_c_function.py"
      - ".github/workflows/real-nginx-ims.yml"
  push:
    branches: [main, master]
    paths:
      - "components/nginx-module/**"
      - "components/rust-converter/**"
      - "tools/ci/verify_real_nginx_ims.sh"
      - "tools/c-extract/extract_c_function.py"
      - ".github/workflows/real-nginx-ims.yml"

permissions:
  contents: read

concurrency:
  group: ims-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-real-nginx-ims:
    name: Verify Delegated IMS with Real NGINX (${{ matrix.nginx_channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - nginx_channel: stable
            port: 18088
          - nginx_channel: mainline
            port: 18089

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            pkg-config \
            python3 \
            rsync \
            zlib1g-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            components/rust-converter -> target
          cache-bin: false

      - name: Sanity check required commands
        run: |
          set -euo pipefail
          for cmd in bash gcc make python3 cargo rustc rustup curl rsync awk tar; do
            command -v "$cmd" >/dev/null
          done

      - name: Ensure Rust project compiles
        working-directory: components/rust-converter
        run: cargo check --all-targets

      - name: Run real NGINX If-Modified-Since validation
        env:
          MATRIX_NGINX_CHANNEL: ${{ matrix.nginx_channel }}
          MATRIX_PORT: ${{ matrix.port }}
        run: bash ./tools/ci/verify_real_nginx_ims.sh --nginx-version "${MATRIX_NGINX_CHANNEL}" --port "${MATRIX_PORT}"
