name: Official NGINX Docker Validation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      module_repo:
        description: Repository URL for the exact release candidate source.
        required: false
        type: string
        default: ""
      module_ref:
        description: Ref used only to resolve the candidate source checkout.
        required: false
        type: string
        default: ""
      module_sha:
        description: Immutable candidate SHA consumed by the Docker build.
        required: false
        type: string
        default: ""
  # Tag releases: docker-image matrix entries are release_blocking=true, so
  # the validation must run on the tag SHA before publication (F-03 fix).
  # GitHub applies the paths filter to branch pushes only: a v* tag push
  # triggers the workflow unconditionally, so tag-SHA validation can never
  # be skipped by a paths miss.
  push:
    tags:
      - 'v*'
    branches: [main, master]
    paths:
      - "Makefile"
      - "components/nginx-module/**"
      - "components/rust-converter/**"
      - "examples/docker/**"
      - "packaging/checksums.sha256"
      - "packaging/scripts/install-verified-rustup.sh"
      - "packaging/scripts/verify-checksum.sh"
      - "tools/release-matrix.json"
      - "tools/release/matrix/official_docker_matrix.py"
      - "tools/ci/verify_official_nginx_docker.sh"
      - "tools/ci/retry_transient.sh"
      - "packaging/scripts/verify-nginx-org-module.sh"
      - "tools/release/matrix/record_container_evidence.py"
      - "tools/release/matrix/record_nginx_org_evidence.py"
      - "tools/release/matrix/evidence_contract.py"
      - ".github/workflows/official-nginx-docker.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Makefile"
      - "components/nginx-module/**"
      - "components/rust-converter/**"
      - "examples/docker/**"
      - "packaging/checksums.sha256"
      - "packaging/scripts/install-verified-rustup.sh"
      - "packaging/scripts/verify-checksum.sh"
      - "tools/release-matrix.json"
      - "tools/release/matrix/official_docker_matrix.py"
      - "tools/ci/verify_official_nginx_docker.sh"
      - "tools/ci/retry_transient.sh"
      - "packaging/scripts/verify-nginx-org-module.sh"
      - "tools/release/matrix/record_container_evidence.py"
      - "tools/release/matrix/record_nginx_org_evidence.py"
      - "tools/release/matrix/evidence_contract.py"
      - ".github/workflows/official-nginx-docker.yml"

permissions: {}

concurrency:
  group: official-nginx-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve official Docker matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release-blocking Docker rows
        id: resolve
        run: |
          # official_docker_matrix.py selects artifact_type == "docker-image"
          # and release_blocking is True, then emits one matrix_row_id for
          # every version/os/libc/arch execution row.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/release/matrix")
          from official_docker_matrix import load_official_docker_entries

          rows = load_official_docker_entries(Path("tools/release-matrix.json"))
          if not rows:
              raise SystemExit(
                  "No release-blocking official Docker rows were resolved"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(rows, separators=(',', ':'))}\n")
          print(f"Resolved {len(rows)} official Docker execution rows")
          for row in rows:
              print(
                  f"  {row['matrix_row_id']}: {row['image_ref']}@"
                  f"{row['image_digest']}"
              )
          PY

  build-and-verify:
    name: Build + Functional Check (${{ matrix.matrix_row_id }})
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve source clone target
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_REPO: ${{ github.event.pull_request.head.repo.clone_url || '' }}
          PR_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_SHA: ${{ github.event.pull_request.head.sha || '' }}
          DEFAULT_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          DEFAULT_REF: ${{ github.ref_name }}
          DEFAULT_SHA: ${{ github.sha }}
          CALLER_MODULE_REPO: ${{ inputs.module_repo || '' }}
          CALLER_MODULE_REF: ${{ inputs.module_ref || '' }}
          CALLER_MODULE_SHA: ${{ inputs.module_sha || '' }}
        run: |
          if [[ -n "${CALLER_MODULE_SHA}" ]]; then
            if [[ -z "${CALLER_MODULE_REPO}" || -z "${CALLER_MODULE_REF}" ]]; then
              echo "ERROR: workflow_call must provide module_repo, module_ref, and module_sha together." >&2
              exit 1
            fi
            {
              printf 'repo=%s\n' "${CALLER_MODULE_REPO}"
              printf 'ref=%s\n' "${CALLER_MODULE_REF}"
              printf 'sha=%s\n' "${CALLER_MODULE_SHA}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            {
              printf 'repo=%s\n' "${PR_REPO}"
              printf 'ref=%s\n' "${PR_REF}"
              printf 'sha=%s\n' "${PR_SHA}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              printf 'repo=%s\n' "${DEFAULT_REPO}"
              printf 'ref=%s\n' "${DEFAULT_REF}"
              printf 'sha=%s\n' "${DEFAULT_SHA}"
            } >> "$GITHUB_OUTPUT"
          fi

      # A shell build instead of docker/build-push-action, so the registry
      # and frontend fetches can go through tools/ci/retry_transient.sh.  The
      # helper retries only transient registry or network failures (for
      # example a Docker Hub 502 on the docker/dockerfile frontend pull); a
      # compile failure fails on the first attempt.  The GitHub Actions layer
      # cache is not used: a run step cannot reach the runtime cache token.
      - name: Build from source on official nginx base
        env:
          IMAGE_NAME: nginx-markdown-official-check:${{ matrix.docker_tag }}
          BASE_NAME: ${{ matrix.image_ref }}
          BASE_DIGEST: ${{ matrix.image_digest }}
          MODULE_REPO: ${{ steps.source.outputs.repo }}
          MODULE_REF: ${{ steps.source.outputs.ref }}
          MODULE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # Self-attestation for the reused-image verification: the
          # --skip-build path reads these OCI labels back via `docker image
          # inspect` and only claims the matrix binding when the revision and
          # base digest match.  Without the labels that step fails closed.
          bash tools/ci/retry_transient.sh -- docker buildx build \
            --load \
            --progress plain \
            --file ./examples/docker/Dockerfile.official-nginx-source-build \
            --tag "${IMAGE_NAME}" \
            --label "org.opencontainers.image.revision=${MODULE_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_NAME}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --build-arg "NGINX_IMAGE=${BASE_NAME}@${BASE_DIGEST}" \
            --build-arg "MODULE_REPO=${MODULE_REPO}" \
            --build-arg "MODULE_REF=${MODULE_REF}" \
            --build-arg "MODULE_SHA=${MODULE_SHA}" \
            .
        shell: bash

      - name: Verify runtime behavior
        env:
          IMAGE_NAME: nginx-markdown-official-check:${{ matrix.docker_tag }}
          JOB_NGINX_TAG: ${{ matrix.image_ref }}
          EXPECTED_NGINX_VERSION: ${{ matrix.nginx_version }}
          IMAGE_REFERENCE: ${{ matrix.image_ref }}
          IMAGE_DIGEST: ${{ matrix.image_digest }}
          MATRIX_ROW_ID: ${{ matrix.matrix_row_id }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_LIBC: ${{ matrix.libc }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MODULE_REPO: ${{ steps.source.outputs.repo }}
          MODULE_REF: ${{ steps.source.outputs.ref }}
          MODULE_SHA: ${{ steps.source.outputs.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/official-nginx-docker/${{ matrix.matrix_row_id }}
          JOB_PORT: 18080
        run: |
          bash ./tools/ci/verify_official_nginx_docker.sh \
            --skip-build \
            --image-name "${IMAGE_NAME}" \
            --nginx-tag "${JOB_NGINX_TAG}" \
            --expected-nginx-version "${EXPECTED_NGINX_VERSION}" \
            --image-reference "${IMAGE_REFERENCE}" \
            --image-digest "${IMAGE_DIGEST}" \
            --matrix-row-id "${MATRIX_ROW_ID}" \
            --arch "${MATRIX_ARCH}" \
            --libc "${MATRIX_LIBC}" \
            --module-repo "${MODULE_REPO}" \
            --module-ref "${MODULE_REF}" \
            --module-sha "${MODULE_SHA}" \
            --artifact-dir "${ARTIFACT_DIR}" \
            --port "${JOB_PORT}"

      # Container-registry compatibility evidence.  The verifier runs inside
      # the image that this job built, on its own private prefix and port,
      # and the record binds the pinned base digest, the built image ID, the
      # module copied out of the image, the candidate SHA and this run.
      # release-packages.yml stages the record in its release gate.
      - name: Write container compatibility evidence
        env:
          IMAGE_NAME: nginx-markdown-official-check:${{ matrix.docker_tag }}
          EXPECTED_NGINX_VERSION: ${{ matrix.nginx_version }}
          IMAGE_REFERENCE: ${{ matrix.image_ref }}
          IMAGE_DIGEST: ${{ matrix.image_digest }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_LIBC: ${{ matrix.libc }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MODULE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${MATRIX_ARCH}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "ERROR: ${MATRIX_ARCH} evidence must run natively, found $(uname -m)" >&2
              exit 1
              ;;
          esac
          if [[ ! "${MATRIX_OS}" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
            echo "ERROR: invalid matrix os ${MATRIX_OS}" >&2
            exit 1
          fi
          built_image_id="$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}")"
          mkdir -p dist/evidence-input/module dist/evidence-output dist/compat-evidence
          container="container-evidence-${RANDOM}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
            return 0
          }
          trap cleanup EXIT
          docker run -d --name "${container}" --user 0 \
            -v "${GITHUB_WORKSPACE}:/work:ro" \
            -v "${GITHUB_WORKSPACE}/dist/evidence-output:/out" \
            --entrypoint sh "${IMAGE_NAME}" -c 'while :; do sleep 3600; done'
          docker cp "${container}:/etc/nginx/modules/ngx_http_markdown_filter_module.so" \
            dist/evidence-input/module/ngx_http_markdown_filter_module.so
          # readelf (binutils) is required: without it static_brotli is SKIP
          # and the record cannot support a release promise.
          if [[ "${MATRIX_LIBC}" == "musl" ]]; then
            bash tools/ci/retry_transient.sh -- docker exec "${container}" \
              apk add --no-cache bash python3 binutils curl
          else
            bash tools/ci/retry_transient.sh -- docker exec "${container}" apt-get update
            bash tools/ci/retry_transient.sh -- docker exec -e DEBIAN_FRONTEND=noninteractive \
              "${container}" apt-get install -y --no-install-recommends python3 binutils curl
          fi
          # Not retried: a verifier failure is a real compatibility failure.
          docker exec "${container}" bash /work/packaging/scripts/verify-nginx-org-module.sh \
            --module /etc/nginx/modules/ngx_http_markdown_filter_module.so \
            --nginx-version "${EXPECTED_NGINX_VERSION}" \
            --arch "${MATRIX_ARCH}" \
            --libc "${MATRIX_LIBC}" \
            --port 18181 \
            --out /out/ledger.json
          python3 tools/release/matrix/record_container_evidence.py \
            --module-dir dist/evidence-input/module \
            --ledger dist/evidence-output/ledger.json \
            --nginx-version "${EXPECTED_NGINX_VERSION}" \
            --libc "${MATRIX_LIBC}" \
            --arch "${MATRIX_ARCH}" \
            --distro "${MATRIX_OS}" \
            --image-reference "${IMAGE_REFERENCE}" \
            --image-digest "${IMAGE_DIGEST}" \
            --built-image-id "${built_image_id}" \
            --out "dist/compat-evidence/container-${EXPECTED_NGINX_VERSION}-${MATRIX_OS}-${MATRIX_LIBC}-${MATRIX_ARCH}.json" \
            --source-sha "${MODULE_SHA}" \
            --verified-by "ci:official-nginx-docker/build-and-verify" \
            --workflow-run-url "${RUN_URL}"
        shell: bash

      - name: Upload container compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-evidence-container-${{ matrix.nginx_version }}-${{ matrix.os }}-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/compat-evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: official-nginx-docker-${{ matrix.docker_tag }}-failure
          path: ${{ runner.temp }}/official-nginx-docker/${{ matrix.matrix_row_id }}
          if-no-files-found: ignore
