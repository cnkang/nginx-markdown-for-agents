# Release Packages — Unified DEB/RPM build, test, sign, and publish pipeline
#
# Architecture: prepare → build (matrix) → package (matrix) → smoke-test (matrix) → integrity → publish
# Tag releases also run release-gate after smoke-test; publish waits for both
# release-gate and integrity to pass.
#
# Triggers:
#   - Tag push (v*): full pipeline ending with GitHub Release upload
#   - workflow_dispatch: full pipeline ending with workflow artifact upload
#
# Security:
#   - Workflow-level permissions: {} (no permissions by default)
#   - Each job grants only the minimum permissions it needs
#   - All third-party actions MUST be pinned to full SHA commit hashes (Req 9.6)
#   - GPG signing runs in a Protected Environment with required reviewers
#   - workflow_dispatch input is validated before use (Req 9.7)
#
# Matrix generation:
#   The prepare job reads tools/release-matrix.json and extracts release-
#   blocking glibc NGINX versions owned by this workflow (DEB/RPM targets).
#   This ensures the release workflow always builds packages for every version
#   declared in the release matrix, preventing matrix/workflow drift.
#
# Extension points:
#   - Add new NGINX versions: update tools/release-matrix.json with a
#     release_blocking glibc entry owned by this workflow for each supported
#     architecture and add the NGINX source SHA256 checksum to
#     packaging/checksums.sha256. No workflow changes needed for versions or
#     architectures represented in the release matrix.
#   - Add new smoke-test distro images: update the representative container
#     list in the prepare job. The release matrix currently owns versions and
#     architectures, not container image names.
#   - Enable GPG signing: configure GPG_PRIVATE_KEY, GPG_PASSPHRASE, GPG_KEY_ID secrets
#     in the Protected Environment "release-signing" with required reviewers.
#     Tag releases ALWAYS run the signing job; no repository variable needed.
#
# GPG Signing Policy (0.8.x release line):
#   Tag releases: signing is MANDATORY. The integrity-signing job always runs
#   for tag pushes and the publish job requires signing to succeed. If GPG
#   secrets are missing, the pipeline fails early with a clear preflight error.
#   workflow_dispatch: signing is skipped; publish proceeds with SHA256SUMS-only
#   integrity verification (useful for testing the build/package pipeline).
#
# Path filters note:
#   GitHub Actions path filters only apply to push events on branches, NOT tag pushes.
#   For tag pushes (v*), the workflow always runs regardless of path filters.
#   The paths below are documented for reference and would apply if branch-based
#   push triggers were added for testing:
#     - packaging/**
#     - components/**
#     - .github/workflows/release-packages.yml

name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Optional version override (format: MAJOR.MINOR.PATCH, e.g. 0.7.0).
          Prerelease suffixes (e.g. 0.7.0-rc.1) are rejected because they are
          incompatible with RPM versioning. If empty, tag runs derive the
          version from the git ref; non-tag runs use the checked-in Cargo.toml
          package version.
        required: false
        type: string

# Workflow-level: no permissions granted by default (Req 9.5).
# Each job declares its own minimum required permissions.
permissions: {}

# Jobs:
#   - prepare:             Resolve build matrix from tools/release-matrix.json
#   - build:               Compile Rust library + NGINX dynamic module (matrix)
#   - package:             Generate .deb/.rpm via nFPM (matrix)
#   - smoke-test:          Container install + module load verification (matrix)
#   - release-gate:        Release governance and artifact layout gate
#   - integrity-checksums: SHA256SUMS + release-manifest.json generation
#   - integrity-signing:   Optional GPG signing (protected environment, tag only)
#   - publish:             Upload to GitHub Release (tag) or workflow artifacts (dispatch)
#
# All third-party actions in jobs below MUST use full SHA pinning (Req 9.6).
# Example: actions/checkout@<full-sha> # v4.x.x
#
# release-packages.yml is the canonical release package workflow and official release path.

env:
  RUST_TOOLCHAIN: 1.97.1
  RUST_FEATURES: streaming,incremental,prune_noise_regions

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prepare Job: Resolve build matrix from tools/release-matrix.json
  # Extracts unique NGINX versions with full glibc support to drive the
  # build/package/smoke-test matrices dynamically.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Resolve Package Matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      nginx_versions: ${{ steps.resolve.outputs.nginx_versions }}
      package_matrix: ${{ steps.resolve.outputs.package_matrix }}
      smoke_matrix: ${{ steps.resolve.outputs.smoke_matrix }}
      musl_matrix: ${{ steps.resolve.outputs.musl_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve matrix from release-matrix.json
        id: resolve
        run: |
          python3 - <<'PY'
          import json, os

          with open("tools/release-matrix.json", "r") as f:
              data = json.load(f)

          # Extract unique NGINX versions for this workflow's release-blocking
          # glibc entries. The release matrix schema uses entries/libc/
          # nginx_version fields.
          owner = ".github/workflows/release-packages.yml"
          glibc_full = [
              e for e in data.get("entries", [])
              if e.get("owner_workflow") == owner
              and e.get("support_tier") == "supported"
              and e.get("libc") == "glibc"
              and e.get("release_blocking") is True
          ]

          versions = sorted(
              set(e["nginx_version"] for e in glibc_full),
              key=lambda v: tuple(int(p) for p in v.split("."))
          )
          package_matrix = sorted(
              [
                  {"nginx_version": version, "arch": arch}
                  for version, arch in {
                      (e["nginx_version"], e["arch"]) for e in glibc_full
                  }
              ],
              key=lambda e: (
                  tuple(int(p) for p in e["nginx_version"].split(".")),
                  e["arch"],
              ),
          )

          if len(versions) == 0:
              print("ERROR: No release-blocking glibc NGINX versions owned by release-packages.yml found in tools/release-matrix.json")
              raise SystemExit(1)
          if len(package_matrix) == 0:
              print("ERROR: No release package matrix entries resolved from tools/release-matrix.json")
              raise SystemExit(1)

          # Build smoke-test matrix: each version × representative distros × archs
          smoke_containers = {
              "deb": [
                  {"container": "ubuntu:22.04", "arch": "amd64"},
                  {"container": "ubuntu:24.04", "arch": "amd64"},
                  {"container": "debian:12", "arch": "amd64"},
                  {"container": "ubuntu:24.04", "arch": "arm64"},
              ],
              "rpm": [
                  {"container": "almalinux:9", "arch": "amd64"},
                  {"container": "almalinux:9", "arch": "arm64"},
              ],
          }

          smoke_matrix = []
          for package_entry in package_matrix:
              version = package_entry["nginx_version"]
              arch = package_entry["arch"]
              for fmt, containers in smoke_containers.items():
                  for entry in containers:
                      if entry["arch"] != arch:
                          continue
                      smoke_matrix.append({
                          "container": entry["container"],
                          "format": fmt,
                          "nginx_version": version,
                          "arch": arch,
                      })

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"nginx_versions={json.dumps(versions)}\n")
              out.write(f"package_matrix={json.dumps(package_matrix)}\n")
              out.write(f"smoke_matrix={json.dumps(smoke_matrix)}\n")

              # Musl dynamic-module matrix: entries owned by
              # release-binaries.yml (musl only).  Built in this workflow so
              # all supported artifacts are produced BEFORE the release is
              # published (the previous post-publication musl build could
              # never block a release).
              musl_entries = [
                  {
                      "nginx": e["nginx_version"],
                      "os_type": e["libc"],
                      "arch": {"amd64": "x86_64", "arm64": "aarch64"}.get(e["arch"], e["arch"]),
                  }
                  for e in data.get("entries", [])
                  if e.get("owner_workflow") == ".github/workflows/release-binaries.yml"
                  and e.get("support_tier") == "supported"
                  and e.get("artifact_type") == "dynamic-module"
                  and e.get("libc") == "musl"
              ]
              musl_entries.sort(
                  key=lambda e: (
                      tuple(int(p) for p in e["nginx"].split(".")),
                      e["arch"],
                  )
              )
              if musl_entries:
                  out.write(f"musl_matrix={json.dumps(musl_entries)}\n")
              else:
                  out.write("musl_matrix=[]\n")
                  print("ERROR: No musl dynamic-module entries found in tools/release-matrix.json for release-binaries.yml ownership")
                  raise SystemExit(1)

          print(f"Resolved {len(versions)} NGINX versions: {versions}")
          print(f"Package matrix: {len(package_matrix)} entries")
          print(f"Smoke test matrix: {len(smoke_matrix)} entries")
          print(f"Musl dynamic-module matrix: {len(musl_entries)} entries")
          PY
        shell: bash

  build:
    name: Build - nginx-${{ matrix.nginx_version }} - ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: almalinux@sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.package_matrix) }}

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            binutils \
            ca-certificates \
            curl-minimal \
            pcre2-devel \
            zlib-devel \
            brotli-devel \
            pkg-config \
            openssl-devel \
            tar \
            gzip \
            findutils \
            file \
            git
          dnf clean all
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Derive and validate version
        id: version
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif printf '%s' "${TAG_REF}" | grep -qE '^refs/tags/v'; then
            VERSION="${TAG_REF#refs/tags/v}"
          else
            VERSION="$(
              sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                components/rust-converter/Cargo.toml | head -1
            )"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "ERROR: Cannot derive package version" >&2
            exit 1
          fi
          echo "raw_version=${VERSION}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.raw_version }}
        run: |
          ./packaging/scripts/validate-version.sh "${VERSION}"
          echo "PKG_VERSION=${VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Rust toolchain
        run: |
          bash ./packaging/scripts/install-verified-rustup.sh \
            --arch "${{ matrix.arch }}" \
            --toolchain "${RUST_TOOLCHAIN}"
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          "${HOME}/.cargo/bin/rustc" --version
          "${HOME}/.cargo/bin/cargo" --version
        shell: bash

      - name: Determine Rust target triple
        run: |
          case "${{ matrix.arch }}" in
            amd64) RUST_TARGET="x86_64-unknown-linux-gnu" ;;
            arm64) RUST_TARGET="aarch64-unknown-linux-gnu" ;;
            *)
              echo "ERROR: unsupported arch: ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac
          echo "RUST_TARGET=${RUST_TARGET}" >> "$GITHUB_ENV"
          echo "Rust target triple: ${RUST_TARGET}"
        shell: bash

      - name: Download NGINX source
        env:
          NGINX_VERSION: ${{ matrix.nginx_version }}
        run: |
          NGINX_TARBALL="nginx-${NGINX_VERSION}.tar.gz"
          NGINX_URL="https://nginx.org/download/${NGINX_TARBALL}"
          curl -fsSL -o "${NGINX_TARBALL}" "${NGINX_URL}"
          chmod +x packaging/scripts/verify-checksum.sh
          packaging/scripts/verify-checksum.sh \
            -f "${NGINX_TARBALL}" \
            -i "nginx-${NGINX_VERSION}"
          tar xzf "${NGINX_TARBALL}"
          echo "NGINX_SRC=${GITHUB_WORKSPACE}/nginx-${NGINX_VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - name: Build Rust converter
        run: |
          rustup target add "${RUST_TARGET}"
          cd components/rust-converter
          # Release package builds link the Rust staticlib into an NGINX C
          # module and validate exported symbols with GNU binutils. Keep LTO
          # disabled here so the archive contains native objects that nm/ld can
          # inspect and link reliably.
          cargo build --release --locked --target "${RUST_TARGET}" \
            --features "${RUST_FEATURES}" \
            --config profile.release.lto=false
        shell: bash

      - name: Verify required FFI symbols in Rust static library
        run: |
          RUST_LIB="components/rust-converter/target/${RUST_TARGET}/release/libnginx_markdown_converter.a"
          if [[ ! -f "${RUST_LIB}" ]]; then
            echo "ERROR: Rust static library not found: ${RUST_LIB}" >&2
            exit 1
          fi
          command -v nm >/dev/null 2>&1 || {
            echo "ERROR: nm not found; install binutils in the release build image" >&2
            exit 1
          }
          SYMBOLS="$(nm -g "${RUST_LIB}" 2>/dev/null | awk '{print $NF}' || true)"
          if [[ -z "${SYMBOLS}" ]]; then
            echo "ERROR: nm produced no symbol output for ${RUST_LIB}" >&2
            exit 1
          fi
          MISSING=0
          for sym in markdown_streaming_new_with_code \
                     markdown_incremental_new_with_code \
                     markdown_decompress_bounded; do
            if ! grep -Eq "^_?${sym}$" <<<"${SYMBOLS}"; then
              echo "ERROR: Required symbol ${sym} not found in ${RUST_LIB}" >&2
              MISSING=1
            else
              echo "  OK: ${sym}" >&2
            fi
          done
          if [[ "${MISSING}" -ne 0 ]]; then
            echo "ERROR: One or more required FFI symbols missing from release build" >&2
            exit 1
          fi
          echo "All required FFI symbols verified." >&2
        shell: bash

      - name: Configure NGINX with dynamic module
        env:
          NGINX_VERSION: ${{ matrix.nginx_version }}
          NGX_MARKDOWN_BROTLI_STREAMING: "on"
        run: |
          cd "${NGINX_SRC}"
          ./configure \
            --with-compat \
            --add-dynamic-module="${GITHUB_WORKSPACE}/components/nginx-module"
        shell: bash

      - name: Build NGINX binary and dynamic module
        run: |
          cd "${NGINX_SRC}"
          # The public top-level `build` target produces the binary, dynamic
          # modules, and manpage. `binary` is only defined in objs/Makefile on
          # older supported releases such as NGINX 1.24.0, so invoking it via
          # the top-level Makefile would fail before release evidence runs.
          make -j"$(nproc)" build
        shell: bash

      - name: Verify build artifacts exist
        run: |
          # Verify both artifacts were produced before copying.
          # If either is missing, fail early with a clear error.
          for artifact in \
            "${NGINX_SRC}/objs/nginx" \
            "${NGINX_SRC}/objs/ngx_http_markdown_filter_module.so"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "ERROR: Build artifact not found: ${artifact}" >&2
              echo "  The build step may need a different make target." >&2
              exit 1
            fi
          done
          # Verify the nginx binary is executable.
          test -x "${NGINX_SRC}/objs/nginx" || {
            echo "ERROR: ${NGINX_SRC}/objs/nginx is not executable" >&2
            exit 1
          }
        shell: bash

      - name: Copy artifacts to build directory
        run: |
          mkdir -p build
          cp "${NGINX_SRC}/objs/ngx_http_markdown_filter_module.so" build/
          cp "${NGINX_SRC}/objs/nginx" build/nginx
        shell: bash

      - name: Verify ELF shared object
        run: |
          file_output="$(file build/ngx_http_markdown_filter_module.so)"
          echo "${file_output}"
          if ! printf '%s' "${file_output}" | grep -q "ELF"; then
            echo "ERROR: build/ngx_http_markdown_filter_module.so is not a valid ELF file" >&2
            exit 1
          fi
        shell: bash

      - name: Verify Brotli runtime dependency
        run: |
          command -v readelf >/dev/null 2>&1 || {
            echo "ERROR: readelf not found; install binutils in the release build image" >&2
            exit 1
          }
          dynamic_section="$(readelf -d build/ngx_http_markdown_filter_module.so)"
          if ! grep -Eq 'NEEDED.*libbrotlidec\.so' <<<"${dynamic_section}"; then
            echo "ERROR: release module is not linked to libbrotlidec" >&2
            exit 1
          fi
          echo "Brotli decoder dependency verified." >&2
        shell: bash

      - name: Verify required FFI symbols
        run: |
          echo "=== Verifying required FFI symbols in module ===" >&2
          REQUIRED_SYMBOLS=(
            markdown_streaming_new_with_code
            markdown_streaming_feed
            markdown_streaming_finalize
            markdown_streaming_abort
            markdown_streaming_output_free
            markdown_incremental_new_with_code
            markdown_incremental_feed
            markdown_incremental_finalize
            markdown_incremental_free
            markdown_decompress_bounded
            markdown_decompress_free
            markdown_convert
            markdown_converter_new
            markdown_converter_free
            markdown_result_free
          )
          MISSING=()
          for sym in "${REQUIRED_SYMBOLS[@]}"; do
            if ! nm -D build/ngx_http_markdown_filter_module.so \
                | awk '$2 != "U" && $NF == "'"${sym}"'" {found=1} END {exit !found}'; then
              MISSING+=("${sym}")
            fi
          done
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: Missing required FFI symbols (defined exports):" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            exit 1
          fi
          echo "All ${#REQUIRED_SYMBOLS[@]} required FFI symbols verified as defined exports." >&2
        shell: bash

      - name: Upload module artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-so-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: |
            build/ngx_http_markdown_filter_module.so
            build/nginx
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Musl Build Job: Build musl dynamic-module tarballs BEFORE publication.
  # Previously release-binaries.yml built musl artifacts only after the
  # release was published (trigger: release: [published]) — a failed musl
  # build could never block the public release (F-01).  This job builds the
  # same matrix in the tag pipeline so every supported artifact exists before
  # the publish job runs.  release-binaries.yml keeps workflow_dispatch for
  # manual rebuilds of existing releases.
  # ─────────────────────────────────────────────────────────────────────────────
  musl-build:
    name: Musl Build - NGINX ${{ matrix.nginx }} - ${{ matrix.arch }}
    needs: prepare
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.musl_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build musl module tarball
        run: |
          ./tools/build_release.sh "${{ matrix.nginx }}" musl "${{ matrix.arch }}"

      - name: Upload musl module tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-musl-module-${{ matrix.nginx }}-${{ matrix.arch }}
          path: dist/${{ matrix.nginx }}-musl-${{ matrix.arch }}/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Package Job: Generate .deb/.rpm via nFPM (matrix)
  # Consumes the compiled .so from the build job and produces distribution
  # packages following 0.8.x release package naming and layout conventions.
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package - nginx-${{ matrix.nginx_version }} - ${{ matrix.arch }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.package_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: module-so-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: build/

      - name: Install nFPM
        run: |
          NFPM_VERSION="2.46.3"
          NFPM_TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          NFPM_URL="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_TARBALL}"
          curl -fsSL -o "${NFPM_TARBALL}" "${NFPM_URL}"
          chmod +x packaging/scripts/verify-checksum.sh
          packaging/scripts/verify-checksum.sh \
            -f "${NFPM_TARBALL}" \
            -i "nfpm-${NFPM_VERSION}-linux-x86_64"
          mkdir -p /tmp/nfpm-extract
          tar -xz -C /tmp/nfpm-extract -f "${NFPM_TARBALL}"
          if [[ ! -f /tmp/nfpm-extract/nfpm ]]; then
            echo "ERROR: nfpm binary not found in tarball" >&2; exit 1
          fi
          sudo cp /tmp/nfpm-extract/nfpm /usr/local/bin/nfpm
          sudo chmod 755 /usr/local/bin/nfpm
          rm -rf /tmp/nfpm-extract "${NFPM_TARBALL}"
          nfpm --version
        shell: bash

      - name: Set packaging environment variables
        id: pkg-env
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          NGINX_VERSION: ${{ matrix.nginx_version }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          # Determine package version
          if [[ -n "${INPUT_VERSION}" ]]; then
            PKG_VERSION="${INPUT_VERSION}"
          elif printf '%s' "${TAG_REF}" | grep -qE '^refs/tags/v'; then
            PKG_VERSION="${TAG_REF#refs/tags/v}"
          else
            PKG_VERSION="$(
              sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                components/rust-converter/Cargo.toml | head -1
            )"
          fi
          if [[ -z "${PKG_VERSION}" ]]; then
            echo "ERROR: Cannot derive package version" >&2
            exit 1
          fi

          ./packaging/scripts/validate-version.sh "${PKG_VERSION}"

          NFPM_ARCH="${MATRIX_ARCH}"

          # Map arch for RPM naming (amd64→x86_64, arm64→aarch64)
          case "${NFPM_ARCH}" in
            amd64)  RPM_ARCH="x86_64" ;;
            arm64)  RPM_ARCH="aarch64" ;;
            *)
              echo "ERROR: Unsupported architecture: ${NFPM_ARCH}" >&2
              exit 1
              ;;
          esac

          # Artifact filenames per 0.8.x release package naming and layout conventions
          DEB_FILENAME="nginx-module-markdown-for-agents_${PKG_VERSION}_nginx-${NGINX_VERSION}_${NFPM_ARCH}.deb"
          RPM_FILENAME="nginx-module-markdown-for-agents-${PKG_VERSION}-nginx${NGINX_VERSION}-1.${RPM_ARCH}.rpm"

          # Export to GITHUB_ENV for subsequent steps
          {
            echo "PKG_VERSION=${PKG_VERSION}"
            echo "NGINX_VERSION=${NGINX_VERSION}"
            echo "NFPM_ARCH=${NFPM_ARCH}"
            echo "RPM_ARCH=${RPM_ARCH}"
            echo "DEB_FILENAME=${DEB_FILENAME}"
            echo "RPM_FILENAME=${RPM_FILENAME}"
          } >> "$GITHUB_ENV"

          # Output for downstream reference
          {
            echo "pkg_version=${PKG_VERSION}"
            echo "deb_filename=${DEB_FILENAME}"
            echo "rpm_filename=${RPM_FILENAME}"
          } >> "$GITHUB_OUTPUT"

          echo "PKG_VERSION=${PKG_VERSION}" >&2
          echo "NGINX_VERSION=${NGINX_VERSION}" >&2
          echo "NFPM_ARCH=${NFPM_ARCH}" >&2
          echo "DEB_FILENAME=${DEB_FILENAME}" >&2
          echo "RPM_FILENAME=${RPM_FILENAME}" >&2
        shell: bash

      - name: Prepare nFPM config with version-stamped preinstall
        run: |
          # Copy preinstall.sh to a temp directory and substitute the version
          # placeholder there, keeping the tracked checkout unmodified.
          NFPM_TMP="$(mktemp -d)"
          cp packaging/nfpm/scripts/preinstall.sh "${NFPM_TMP}/preinstall.sh"
          sed -i "s/%%NGINX_VERSION%%/${NGINX_VERSION}/g" "${NFPM_TMP}/preinstall.sh"

          # Generate a temporary nfpm config that references the temp preinstall
          # while keeping all other paths relative to the workspace root.
          sed "s|./packaging/nfpm/scripts/preinstall.sh|${NFPM_TMP}/preinstall.sh|" \
            packaging/nfpm/nfpm.yaml > "${NFPM_TMP}/nfpm.yaml"

          echo "NFPM_TMP=${NFPM_TMP}" >> "$GITHUB_ENV"
          echo "Version-stamped preinstall.sh written to ${NFPM_TMP}/preinstall.sh" >&2
        shell: bash

      - name: Generate DEB package
        env:
          DEB_FILENAME: ${{ steps.pkg-env.outputs.deb_filename }}
        run: |
          mkdir -p dist
          nfpm package \
            --config "${NFPM_TMP}/nfpm.yaml" \
            --packager deb \
            --target "dist/${DEB_FILENAME}"
          echo "Generated: dist/${DEB_FILENAME}" >&2
          ls -la "dist/${DEB_FILENAME}"
        shell: bash

      - name: Generate RPM package
        env:
          RPM_FILENAME: ${{ steps.pkg-env.outputs.rpm_filename }}
        run: |
          nfpm package \
            --config "${NFPM_TMP}/nfpm.yaml" \
            --packager rpm \
            --target "dist/${RPM_FILENAME}"
          echo "Generated: dist/${RPM_FILENAME}" >&2
          ls -la "dist/${RPM_FILENAME}"
        shell: bash

      - name: Validate install layout
        env:
          DEB_FILENAME: ${{ steps.pkg-env.outputs.deb_filename }}
          RPM_FILENAME: ${{ steps.pkg-env.outputs.rpm_filename }}
        run: |
          bash tools/release/gates/check_install_layout.sh \
            "dist/${DEB_FILENAME}" \
            "dist/${RPM_FILENAME}"
        shell: bash

      - name: Upload DEB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-deb-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: dist/${{ steps.pkg-env.outputs.deb_filename }}
          if-no-files-found: error
          retention-days: 5

      - name: Upload RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-rpm-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: dist/${{ steps.pkg-env.outputs.rpm_filename }}
          if-no-files-found: error
          retention-days: 5

      - name: Package glibc module tarball
        run: |
          # Produce the glibc dynamic-module tarball that the release matrix
          # declares as supported/release-blocking but release-binaries.yml
          # (musl-only) never builds.  Naming matches tools/build_release.sh:
          #   ngx_http_markdown_filter_module-<version>-glibc-<arch>.tar.gz
          # The .so is already in build/ from the build job (downloaded via
          # module-so artifact at the top of this job).
          SO="$(find build/ -name 'ngx_http_markdown_filter_module.so' -print -quit)"
          if [[ -z "${SO}" ]]; then
            echo "ERROR: module .so not found in build/" >&2
            exit 1
          fi

          # Map arch for tarball naming (amd64→x86_64, arm64→aarch64).
          # Use NFPM_ARCH (exported to GITHUB_ENV by the pkg-env step) —
          # MATRIX_ARCH was only a step-local env var and is undefined here.
          case "${NFPM_ARCH}" in
            amd64) TARBALL_ARCH="x86_64" ;;
            arm64) TARBALL_ARCH="aarch64" ;;
            *) echo "ERROR: Unsupported architecture: ${NFPM_ARCH}" >&2; exit 1 ;;
          esac

          TARBALL_NAME="ngx_http_markdown_filter_module-${NGINX_VERSION}-glibc-${TARBALL_ARCH}.tar.gz"
          mkdir -p dist/tarball
          cp "${SO}" "dist/tarball/ngx_http_markdown_filter_module.so"
          tar -C dist/tarball -czf "dist/${TARBALL_NAME}" ngx_http_markdown_filter_module.so
          rm -rf dist/tarball
          echo "Generated: dist/${TARBALL_NAME}" >&2
          ls -la "dist/${TARBALL_NAME}"
        shell: bash

      - name: Upload glibc module tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-glibc-module-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: dist/ngx_http_markdown_filter_module-*-glibc-*.tar.gz
          if-no-files-found: error
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Smoke Test Job: Container install + module load verification (matrix)
  # Installs the nginx.org package and the generated module package inside
  # target distribution containers, then verifies the module loads via nginx -t.
  # This validates ABI compatibility across all supported platforms.
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test - ${{ matrix.container }} - nginx-${{ matrix.nginx_version }} (${{ matrix.format }})
    needs: [prepare, package]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.smoke_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-${{ matrix.format }}-${{ matrix.nginx_version }}-${{ matrix.arch }}
          path: dist/

      - name: Run smoke test
        env:
          NGINX_VERSION: ${{ matrix.nginx_version }}
        run: |
          PKG_FILE="$(find dist/ -name '*.${{ matrix.format }}' -print -quit)"
          if [[ -z "${PKG_FILE}" ]]; then
            echo "ERROR: No .${{ matrix.format }} file found in dist/" >&2
            exit 1
          fi
          chmod +x packaging/scripts/smoke-test-basic.sh
          packaging/scripts/smoke-test-basic.sh "${PKG_FILE}" "${NGINX_VERSION}"
        shell: bash

      - name: Diagnostics on failure
        if: failure()
        env:
          NGINX_VERSION: ${{ matrix.nginx_version }}
        run: |
          chmod +x packaging/scripts/smoke-test-diagnostics.sh
          packaging/scripts/smoke-test-diagnostics.sh
        shell: bash

  # ─────────────────────────────────────────────────────────────────────────────
  # Release Gate Job: release governance gate
  # Runs after package smoke tests and before publication. Pull requests and
  # branch CI deliberately do not run release gates; tag and manual package
  # publications must both pass the same release qualification checks.
  # ─────────────────────────────────────────────────────────────────────────────
  release-gate:
    name: Release Gate
    needs: [prepare, smoke-test]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 14 blocking fuzz targets (15 min each) + short-soak + 091/092 perf
    # gates + toolchain install ≈ 4.5-5.5 h.  GitHub-hosted ubuntu-24.04
    # jobs are capped at 360 minutes, so set the maximum allowed value
    # (tools fuzz-matrix); if the gate outgrows the cap, split the fuzz matrix.
    timeout-minutes: 360
    permissions:
      contents: read
      checks: read
      statuses: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python for release gates
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Generate candidate-bound release gate inputs
        run: |
          python3 tools/release/gates/generate_release_gate_manifests.py \
            --phase inputs \
            --candidate-sha "$(git rev-parse HEAD)"
        shell: bash

      - name: Verify tag SHA is main CI-approved
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "${DEFAULT_BRANCH}" != "main" ]]; then
            echo "ERROR: Release governance expects the protected main branch; found ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          approved_sha="$(gh api "repos/${REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq '.sha')"
          if [[ -z "${approved_sha}" ]] || [[ "${TAG_SHA}" != "${approved_sha}" ]]; then
            echo "ERROR: Tag SHA ${TAG_SHA} is not the exact approved ${DEFAULT_BRANCH} tip (${approved_sha:-missing})." >&2
            exit 1
          fi

          input_dir="$(mktemp -d .tag-sha-checks.XXXXXX)"
          branch_rules="${input_dir}/branch-rules.json"
          check_runs="${input_dir}/check-runs.json"
          statuses="${input_dir}/statuses.json"
          trap 'rm -f "${branch_rules}" "${check_runs}" "${statuses}"; rmdir "${input_dir}"' EXIT

          # This endpoint returns the active rules that actually apply to the
          # branch, including organization-level rules, and needs only
          # metadata read access. Classic branch protection is intentionally
          # not guessed from a failed administration-only API call: migrate
          # its required checks to an active ruleset before tagging.
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/rules/branches/${DEFAULT_BRANCH}?per_page=100" \
            > "${branch_rules}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${TAG_SHA}/check-runs?per_page=100" \
            > "${check_runs}"
          # Required contexts may also be reported through the Commit Status
          # API by external systems; fetch them so the gate does not treat
          # such contexts as missing.
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${TAG_SHA}/status?per_page=100" \
            > "${statuses}"
          python3 tools/release/gates/verify_tag_sha_checks.py \
            --rules-file "${branch_rules}" \
            --check-runs-file "${check_runs}" \
            --statuses-file "${statuses}" \
            --tag-sha "${TAG_SHA}" \
            --branch "${DEFAULT_BRANCH}"
        shell: bash

      - name: Install release gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apache2-utils \
            build-essential \
            dpkg-dev \
            file \
            gzip \
            libbrotli-dev \
            pkg-config \
            rpm \
            tar \
            zlib1g-dev
          python3 -m pip install --requirement requirements-release.txt
        shell: bash

      - name: Verify Python Brotli dependency
        run: |
          set -euo pipefail
          dependency_versions="$(python3 -c 'import brotli, yaml; print(brotli.__version__, yaml.__version__)')"
          [[ "${dependency_versions}" == "1.2.0 6.0.2" ]] || {
            echo "ERROR: release gate requires Brotli==1.2.0 and PyYAML==6.0.2, found ${dependency_versions}" >&2
            exit 1
          }
          echo "Python release dependencies ${dependency_versions} are available."
        shell: bash

      - name: Download all DEB artifacts
        # The release gate validates the UNSIGNED package artifacts on BOTH
        # tag and workflow_dispatch triggers. Signed packages are produced
        # only after the gate passes (integrity-signing job), so the gate
        # must never try to consume `signed-packages` — that artifact does
        # not exist yet when this job runs and the layout/artifact checks
        # below consume dist/.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-deb-*
          path: dist/
          merge-multiple: true

      - name: Download all RPM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-rpm-*
          path: dist/
          merge-multiple: true

      - name: Determine canonical benchmark NGINX version
        id: bench-nginx
        env:
          NGINX_VERSIONS: ${{ needs.prepare.outputs.nginx_versions }}
        run: |
          # Select the oldest (first) release-blocking NGINX version as
          # the canonical benchmark runtime.  Using a single, explicit
          # version avoids the filename collision that occurs when
          # multiple module-so-*-amd64 artifacts are merged into the
          # same directory (they all contain build/nginx and
          # build/ngx_http_markdown_filter_module.so).
          BENCH_VERSION="$(python3 -c "
          import json, sys
          versions = json.loads(sys.argv[1])
          print(versions[0] if versions else '')
          " "${NGINX_VERSIONS}")"
          if [[ -z "${BENCH_VERSION}" ]]; then
            echo "ERROR: No NGINX versions resolved for benchmark" >&2
            exit 1
          fi
          echo "bench_nginx_version=${BENCH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using canonical benchmark NGINX version: ${BENCH_VERSION}" >&2
        shell: bash

      - name: Download canonical benchmark NGINX runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Download ONLY the canonical benchmark version's module+nginx
          # artifact.  This avoids the filename collision from
          # merge-multiple when multiple NGINX versions produce the same
          # build/nginx and build/ngx_http_markdown_filter_module.so names.
          name: module-so-${{ steps.bench-nginx.outputs.bench_nginx_version }}-amd64
          path: module-runtime

      - name: Generate candidate-bound artifact index
        run: |
          python3 tools/release/gates/generate_release_gate_manifests.py \
            --phase artifact \
            --candidate-sha "$(git rev-parse HEAD)" \
            --artifact-root dist
        shell: bash

      - name: Install nightly Rust toolchain for fuzz qualification
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo install cargo-fuzz --version 0.13.1 --locked
        shell: bash

      - name: Run release gates
        env:
          RELEASE_GATE_EXPECTED_CARGO_VERSION: "0.9.2"
          NGINX_BIN: ${{ github.workspace }}/module-runtime/nginx
          MODULE_SO: ${{ github.workspace }}/module-runtime/ngx_http_markdown_filter_module.so
          BENCHMARK_NGINX_VERSION: ${{ steps.bench-nginx.outputs.bench_nginx_version }}
        run: |
          # Run the release gate validators that are not already covered
          # by the build/package/smoke-test jobs above. The full
          # release-gates-check targets include build/test/fuzz which are
          # redundant here (the build and smoke-test jobs already verified
          # those), but we must run the Python gate validators and package
          # layout checks to ensure complete gate coverage. Do not run
          # legacy local-spec validators here; tag release CI checkouts do not
          # include user-local Kiro spec directories.
          python3 tools/release/gates/validate_naming.py
          python3 tools/release/gates/validate_release_gates_090.py
          python3 tools/release/gates/validate_release_gates_080.py \
            --active-version "${RELEASE_GATE_EXPECTED_CARGO_VERSION}"
          python3 tools/release/gates/validate_config_directives.py
          python3 tools/release/gates/validate_release_gates_070.py --mode strict
          python3 tools/release/gates/validate_metrics.py
          python3 tools/release/gates/validate_reason_codes.py
          python3 tools/release/gates/validate_package_metadata.py
          python3 tools/release/gates/validate_k8s_manifests.py
          python3 tools/release/gates/validate_fuzz_packaging.py
          python3 tools/release/gates/validate_release_metadata.py \
            --version "${RELEASE_GATE_EXPECTED_CARGO_VERSION}"
          # Run the 0.9.2-specific blocking checks that are not part of the
          # legacy validator chain above.
          python3 tools/harness/detect_public_surface_drift.py
          PYTHONPATH=. python3 tools/release/gates/validate_release_gates_092.py
          # 0.9.2 blocking qualification mirroring Makefile
          # `release-gates-check-092` stages [8/13]-[12/13].  The tag release
          # path MUST run the same candidate-bound qualification the local
          # gate enforces; publish hard-depends on this job's success.
          python3 tools/release/gates/validate_release_candidate_evidence.py --mode real --git-head
          python3 tools/release/gates/validate_artifact_registry.py --mode real
          python3 tools/release/gates/validate_fuzz_qualification.py --mode real --git-head
          make -C components/nginx-module/tests unit-streaming_impl
          make docs-check
          bash tools/harness/detect_version_consistency.sh
          bash tools/release/gates/check_install_layout.sh dist/*.deb dist/*.rpm
          # The module-enabled NGINX binary is built in the AlmaLinux release
          # image and links to libcrypt.so.2. Run the benchmark in that same
          # immutable runtime family instead of assuming Ubuntu provides the
          # EL9 ABI. Keep the host-side validators above on Ubuntu because
          # they intentionally inspect DEB/RPM layouts with native tooling.
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env GITHUB_REF \
            --env GITHUB_SHA \
            --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ID \
            --env GITHUB_RUN_ATTEMPT \
            --env NGINX_BIN=/workspace/module-runtime/nginx \
            --env MODULE_SO=/workspace/module-runtime/ngx_http_markdown_filter_module.so \
            --env BENCHMARK_NGINX_VERSION \
            almalinux@sha256:d2515c769e7b73f95c4fde38c0a505336ff38f14990c0b7253b77060a049a743 \
            bash -se <<'CONTAINER_SCRIPT'
          set -euo pipefail
          dnf install -y \
            brotli \
            ca-certificates \
            curl-minimal \
            findutils \
            git \
            gawk \
            gzip \
            httpd-tools \
            make \
            libxcrypt \
            procps-ng \
            python3 \
            python3-pip \
            tar
          git config --global --add safe.directory /workspace
          python3 -m pip install --requirement requirements-perf.txt
          chmod +x "${NGINX_BIN}"
          echo "Benchmark NGINX version: ${BENCHMARK_NGINX_VERSION}"
          echo "Architecture: $(uname -m)"
          "${NGINX_BIN}" -V 2>&1 | head -3
          # Produce the 0.9.2 baseline from this exact release candidate and
          # this module-enabled runtime before the blocking gate consumes it.
          # The checked-in copy is audit context; candidate evidence must be
          # generated after checkout so both provenance fields bind to HEAD.
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_RUN="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          tools/perf/run_module_benchmark.sh \
            --output perf/baselines/module-baseline-092-raw.json
          python3 tools/perf/validate_module_probe_artifacts.py \
            --probe-dir perf/baselines/module-baseline-092-raw-probes
          python3 tools/perf/finalize_module_baseline.py \
            --raw-input perf/baselines/module-baseline-092-raw.json \
            --output perf/baselines/module-baseline-092.json \
            --source-git-commit "${CANDIDATE_SHA}" \
            --source-run "${CANDIDATE_RUN}"
          python3 tools/perf/validate_module_probe_artifacts.py \
            --probe-dir perf/baselines/module-baseline-092-raw-probes \
            --baseline perf/baselines/module-baseline-092.json
          # The raw report is the candidate's authoritative measurement and
          # its probes were validated above.  Re-running ApacheBench here
          # would compare two integer-millisecond p50 samples and can turn
          # one timing bucket into a false regression.
          # Keep the tag contract additive with the local 0.9.2 gate:
          # historical 0.9.1 evidence must pass before candidate 0.9.2
          # evidence.  NGINX_BIN is module-enabled and the helper refuses
          # to skip module evidence when it is present.
          make release-perf-evidence-blocking BASELINE_VERSION=091
          EVIDENCE_GATE_BENCHMARK_REPORT=perf/baselines/module-baseline-092-raw.json \
            make release-perf-evidence-blocking BASELINE_VERSION=092
          # Short-soak qualification (Makefile stage [12/13]) against the
          # module-enabled EL9 nginx binary.
          python3 tools/release/gates/validate_soak_qualification.py --mode real --git-head
          CONTAINER_SCRIPT
          python3 tools/release/gates/generate_release_gate_manifests.py \
            --phase final \
            --candidate-sha "$(git rev-parse HEAD)"
          python3 tools/release/gates/validate_release_evidence_manifest.py --mode real
        shell: bash

  # The official Docker matrix is release-blocking for Docker artifacts in
  # tools/release-matrix.json. Call the reusable workflow with this exact
  # candidate SHA so publish cannot proceed on an independently triggered,
  # stale, or merely related Docker validation run.
  official-docker-release-gate:
    name: Official NGINX Docker Release Gate
    needs: [release-gate]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/official-nginx-docker.yml
    with:
      module_repo: ${{ github.server_url }}/${{ github.repository }}.git
      module_ref: ${{ github.ref_name }}
      module_sha: ${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Integrity Checksums Job: SHA256SUMS generation (no protected environment)
  # Generates checksums for all package artifacts. Does not require signing
  # secrets or protected environment approval.
  # ─────────────────────────────────────────────────────────────────────────────
  integrity-checksums:
    name: Integrity - SHA256SUMS
    needs: [smoke-test, integrity-signing, official-docker-release-gate]
    if: >-
      always()
      && needs.smoke-test.result == 'success'
      && needs.official-docker-release-gate.result == 'success'
      && (needs.integrity-signing.result == 'success'
          || (needs.integrity-signing.result == 'skipped'
              && github.ref_type != 'tag'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download signed package artifacts (tag)
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-packages
          path: artifacts/

      - name: Download all DEB artifacts (workflow dispatch)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-deb-*
          path: artifacts/
          merge-multiple: true

      - name: Download all RPM artifacts (workflow dispatch)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-rpm-*
          path: artifacts/
          merge-multiple: true

      - name: Download all glibc module tarballs (workflow dispatch)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-glibc-module-*
          path: artifacts/
          merge-multiple: true

      - name: Download all musl module tarballs (workflow dispatch)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-musl-module-*
          path: artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ===" >&2
          ls -la artifacts/
        shell: bash

      - name: Add authenticated installer bootstrap assets (tag)
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          installer="nginx-markdown-for-agents-installer-${RELEASE_TAG}.sh"
          cp tools/install.sh "artifacts/${installer}"
          cp packaging/nginx-markdown-for-agents-release.asc \
            artifacts/nginx-markdown-for-agents-release.asc
          chmod 0755 "artifacts/${installer}"
          test -s "artifacts/${installer}"
          test -s artifacts/nginx-markdown-for-agents-release.asc
        shell: bash

      - name: Generate release manifest
        env:
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_REF: ${{ github.ref }}
          GH_REPO: ${{ github.repository }}
          GH_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GH_REF_TYPE}" == "tag" ]]; then
            TAG="${GH_REF_NAME}"
            VERSION="${TAG#v}"
            SOURCE_URL="https://github.com/${GH_REPO}/archive/refs/tags/${TAG}.tar.gz"
            SOURCE_SHA="$(curl -fsSL "${SOURCE_URL}" | sha256sum | awk '{print $1}')"
            SOURCE_ARGS=(--source-url "${SOURCE_URL}" --source-sha "${SOURCE_SHA}")
            VERSION_ARGS=(--version "${VERSION}")
          else
            TAG=""
            SOURCE_ARGS=(--no-source)
            VERSION_ARGS=()
            if [[ -n "${GH_INPUT_VERSION}" ]]; then
              VERSION_ARGS=(--version "${GH_INPUT_VERSION}")
            fi
          fi

          TAG_ARGS=()
          if [[ -n "${TAG}" ]]; then
            TAG_ARGS=(--tag "${TAG}")
          fi

          python3 packaging/scripts/generate-release-manifest.py \
            -d artifacts/ \
            "${VERSION_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            --commit "${GH_SHA}" \
            --run-id "${GH_RUN_ID}" \
            --run-number "${GH_RUN_NUMBER}" \
            --ref "${GH_REF}" \
            --ref-type "${GH_REF_TYPE}" \
            --repo "${GH_REPO}" \
            "${SOURCE_ARGS[@]}" \
            > artifacts/release-manifest.json
        shell: bash

      - name: Generate SHA256SUMS
        run: |
          ./packaging/scripts/generate-checksums.sh -d artifacts/
        shell: bash

      - name: Validate release manifest
        run: |
          python3 packaging/scripts/validate-release-manifest.py \
            -m artifacts/release-manifest.json \
            -d artifacts/ \
            --sha256sums artifacts/SHA256SUMS
        shell: bash

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 5

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 5

      - name: Upload installer bootstrap assets (tag)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bootstrap
          path: |
            artifacts/nginx-markdown-for-agents-installer-${{ github.ref_name }}.sh
            artifacts/nginx-markdown-for-agents-release.asc
          if-no-files-found: error
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Integrity Signing Job: Mandatory GPG signing for tag releases
  # Always runs for tag pushes; skipped for workflow_dispatch.
  # Requires Protected Environment "release-signing" with required reviewers.
  #
  # Security:
  #   - GPG private key NEVER appears in logs (all gpg output suppressed)
  #   - Key material is cleaned up after signing
  #   - Preflight validates all 3 required secrets before attempting signing
  # ─────────────────────────────────────────────────────────────────────────────
  integrity-signing:
    name: Integrity - GPG Sign
    needs: [smoke-test, release-gate, musl-build, official-docker-release-gate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: release-signing

    steps:
      - name: Preflight - validate GPG secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          MISSING=()
          [[ -z "${GPG_PRIVATE_KEY}" ]] && MISSING+=("GPG_PRIVATE_KEY")
          [[ -z "${GPG_PASSPHRASE}" ]] && MISSING+=("GPG_PASSPHRASE")
          [[ -z "${GPG_KEY_ID}" ]] && MISSING+=("GPG_KEY_ID")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: Missing required GPG secrets in 'release-signing' environment:" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            echo "" >&2
            echo "To fix: go to Settings → Environments → release-signing → Environment secrets" >&2
            echo "and configure all three secrets (GPG_PRIVATE_KEY, GPG_PASSPHRASE, GPG_KEY_ID)." >&2
            exit 1
          fi
          echo "Preflight OK: all GPG secrets present in release-signing environment." >&2
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-*
          path: artifacts/
          merge-multiple: true

      - name: Install package signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-sig rpm gnupg-utils
        shell: bash

      - name: Sign DEB and RPM packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/package-signing-gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          # Terminate the gpg-agent (which caches the preset passphrase)
          # before removing GNUPGHOME so the cached secret is not left
          # behind for other steps on the same runner.
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "${GNUPGHOME}"' EXIT
          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --yes --import >/dev/null 2>&1
          key_fp="$(gpg --list-keys --with-colons "${GPG_KEY_ID}" \
            | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "${key_fp}" ]] || {
            echo "ERROR: GPG_KEY_ID does not resolve to an imported key" >&2
            exit 1
          }
          printf '%s:6:\n' "${key_fp}" | gpg --import-ownertrust >/dev/null 2>&1
          printf 'allow-preset-passphrase\n' > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          # Collect every matching keygrip (a key may have multiple
          # subkeys, each with its own grip) and preset the passphrase
          # for each one so signing works for any subkey.
          keygrips="$(gpg --list-keys --with-colons --with-keygrip "${GPG_KEY_ID}" \
            | awk -F: '$1 == "grp" {print $10}')"
          preset_passphrase="$(command -v gpg-preset-passphrase || true)"
          if [[ -z "${preset_passphrase}" ]] \
              && [[ -x /usr/lib/gnupg/gpg-preset-passphrase ]]; then
            preset_passphrase=/usr/lib/gnupg/gpg-preset-passphrase
          fi
          if [[ -n "${keygrips}" ]] && [[ -n "${preset_passphrase}" ]]; then
            while IFS= read -r keygrip; do
              [[ -n "${keygrip}" ]] || continue
              printf '%s' "${GPG_PASSPHRASE}" \
                | "${preset_passphrase}" --preset "${keygrip}"
            done <<< "${keygrips}"
          else
            echo "ERROR: gpg-preset-passphrase is required for non-interactive package signing" >&2
            exit 1
          fi
          GPG_KEY_ID="${GPG_KEY_ID}" \
            packaging/scripts/sign-packages.sh --require-packages -d artifacts
        shell: bash

      - name: Upload signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Integrity Signature Job: Sign the checksum file after package signing.
  # Package signatures change package bytes, so SHA256SUMS is generated by the
  # preceding integrity-checksums job from the signed package artifact.
  # ─────────────────────────────────────────────────────────────────────────────
  integrity-signature:
    name: Integrity - Sign SHA256SUMS
    needs: [integrity-checksums, release-gate, official-docker-release-gate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: release-signing

    steps:
      - name: Preflight - validate GPG secrets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ -z "${GPG_PRIVATE_KEY}" ]] && MISSING+=(GPG_PRIVATE_KEY)
          [[ -z "${GPG_PASSPHRASE}" ]] && MISSING+=(GPG_PASSPHRASE)
          [[ -z "${GPG_KEY_ID}" ]] && MISSING+=(GPG_KEY_ID)
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: Missing required GPG secrets in release-signing:" >&2
            printf '  - %s\n' "${MISSING[@]}" >&2
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: artifacts/

      - name: GPG sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          ./packaging/scripts/gpg-sign-checksums.sh artifacts/SHA256SUMS "${GPG_KEY_ID}"
        shell: bash

      - name: Upload SHA256SUMS.asc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-signature
          path: artifacts/SHA256SUMS.asc
          if-no-files-found: error
          retention-days: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Job: Upload to GitHub Release (tag) or workflow artifacts (dispatch)
  # Conditional publishing based on trigger context:
  #   - Tag push (v*): uploads all packages + checksums to the GitHub Release
  #   - workflow_dispatch: uploads everything as a single workflow artifact
  #
  # Security:
  #   - ONLY this job has contents: write permission (Req 10.4)
  #   - All other jobs use contents: read
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [release-gate, integrity-checksums, integrity-signature, official-docker-release-gate]
    # Tag releases: signing always runs, so signing must succeed for publish.
    # workflow_dispatch: signing is skipped, publish proceeds without it.
    if: >-
      always()
      && needs.integrity-checksums.result == 'success'
      && needs.release-gate.result == 'success'
      && needs.official-docker-release-gate.result == 'success'
      && (needs.integrity-signature.result == 'success'
          || (needs.integrity-signature.result == 'skipped'
              && github.ref_type != 'tag'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed package artifacts (tag)
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-packages
          path: release-assets/
          merge-multiple: true

      - name: Download installer bootstrap assets (tag)
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bootstrap
          path: release-assets/

      - name: Download all DEB artifacts
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-deb-*
          path: release-assets/
          merge-multiple: true

      - name: Download all RPM artifacts
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-rpm-*
          path: release-assets/
          merge-multiple: true

      - name: Download all glibc module tarballs
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-glibc-module-*
          path: release-assets/
          merge-multiple: true

      - name: Download all musl module tarballs
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-musl-module-*
          path: release-assets/
          merge-multiple: true

      - name: Download SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: release-assets/

      - name: Download SHA256SUMS.asc
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-signature
          path: release-assets/

      - name: Download SHA256SUMS.asc (best-effort for non-tag)
        if: github.ref_type != 'tag'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: checksums-signature
          path: release-assets/

      - name: Download release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: release-assets/

      - name: List release assets
        run: |
          echo "=== Release assets ===" >&2
          ls -la release-assets/
        shell: bash

      - name: Upload to GitHub Release (tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release-assets/*

      - name: Upload as workflow artifacts (workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: release-assets/
          if-no-files-found: error
          retention-days: 5
