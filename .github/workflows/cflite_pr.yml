name: ClusterFuzzLite PR Fuzz

on:
  pull_request:
    paths:
      - 'components/rust-converter/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_*.yml'
      - 'Makefile'
      - 'Cargo.lock'
      - 'components/rust-converter/Cargo.toml'
      - 'docs/harness/**'
      - 'tools/release/gates/**'

permissions:
  contents: read

jobs:
  pr-fuzz:
    # Untrusted phase: builds and runs PR-controlled fuzz targets.
    # This job receives no tokens: the fuzz actions run without
    # github-token so a compromised action or target cannot exfiltrate
    # write-capable credentials (S6-5).
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare non-root fuzz output
        run: mkdir -p build-out

      - uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        id: build
        with:
          language: rust
          sanitizer: address

      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        id: fuzz
        with:
          mode: code-change
          fuzz-seconds: 600
          sanitizer: address

      - name: Ensure SARIF artifact exists
        if: always()
        run: |
          mkdir -p ./out
          if ! find ./out -maxdepth 1 -type f -name '*.sarif' -print -quit | grep -q .; then
            printf '%s\n' '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"ClusterFuzzLite"}},"results":[]}]}' > ./out/pr-fuzz-empty.sarif
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: pr-fuzz-out
          path: ./out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: pr-fuzz-crashes
          path: ./out/artifacts

  pr-fuzz-sarif:
    # Trusted phase: publishes fuzzer-produced SARIF. Runs after the
    # untrusted job and never executes PR-controlled code; only this
    # job holds security-events: write.
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    needs: pr-fuzz
    if: always() && needs.pr-fuzz.result != 'skipped'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-fuzz-out
          path: ./out/

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        if: hashFiles('./out/*.sarif') != ''
        with:
          sarif_file: ./out/
