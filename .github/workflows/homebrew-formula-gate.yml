name: Homebrew Formula Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packaging/homebrew/**"
      - "packaging/checksums.sha256"
      - "packaging/scripts/install-verified-rustup.sh"
      - "packaging/scripts/audit_homebrew_formula.sh"
      - "packaging/scripts/render_homebrew_formula.py"
      - "packaging/scripts/verify-checksum.sh"
      - "packaging/scripts/verify_homebrew_formula.py"
      - ".github/workflows/homebrew-formula-gate.yml"
      - "Makefile"
      - "components/**"
  push:
    branches: [main, master]
    paths:
      - "packaging/homebrew/**"
      - "packaging/checksums.sha256"
      - "packaging/scripts/install-verified-rustup.sh"
      - "packaging/scripts/audit_homebrew_formula.sh"
      - "packaging/scripts/render_homebrew_formula.py"
      - "packaging/scripts/verify-checksum.sh"
      - "packaging/scripts/verify_homebrew_formula.py"
      - ".github/workflows/homebrew-formula-gate.yml"
      - "Makefile"
      - "components/**"

permissions:
  contents: read

# Superseded PR revisions can stop; each push retains its own validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  brew-formula-check:
    name: Formula audit/install/test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              components/rust-converter/Cargo.toml | head -1
          )"
          if [[ -z "${version}" ]]; then
            echo "::error::Cannot derive current version from components/rust-converter/Cargo.toml" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*)
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "The Homebrew formula applies to stable releases only; ${version} is a prerelease." >&2
              ;;
            *)
              echo "stable=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Homebrew environment
        if: steps.identity.outputs.stable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew --version
          brew update-reset
          # Homebrew 7.x on the runner images no longer keeps a stable local
          # homebrew/core tap clone (API-mode formulae), and the local clone
          # can disappear mid-run: the audit step rendered into it while the
          # install step hit 'Invalid tap name'.  Render the candidate
          # formula into the workflow's own tap instead; audit, install, and
          # test resolve it from there, and Homebrew never removes a custom
          # tap.  The packaging audit script already uses this pattern.
          if [[ ! -d "$(brew --repository codex/formula-gate)" ]]; then
            brew tap-new --no-git codex/formula-gate
          fi
          mkdir -p "$(brew --repository codex/formula-gate)/Formula"
          # Homebrew 7 refuses to load a formula from a tap without an
          # explicit trust grant; trust the whole tap once (the packaging
          # audit script grants the same trust per run for its own
          # temporary tap).
          if brew help trust >/dev/null 2>&1; then
            brew trust codex/formula-gate
          fi

      - name: Audit local formula
        if: steps.identity.outputs.stable == 'true'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          CURRENT_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          make homebrew-formula-check
          FORMULA_PATH="$(brew --repository codex/formula-gate)/Formula/nginx-markdown-module.rb"
          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"
          ARCHIVE_PATH="${RUNNER_TEMP}/nginx-markdown-source.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o "${ARCHIVE_PATH}" "${ARCHIVE_URL}"
          ARCHIVE_SHA="$(shasum -a 256 "${ARCHIVE_PATH}" | awk '{print $1}')"
          python3 packaging/scripts/render_homebrew_formula.py \
            --source packaging/homebrew/nginx-markdown-module.rb \
            --url "${ARCHIVE_URL}" \
            --sha256 "${ARCHIVE_SHA}" \
            --version "${CURRENT_VERSION}" \
            > "${FORMULA_PATH}"
          python3 packaging/scripts/verify_homebrew_formula.py \
            --trusted-template packaging/homebrew/nginx-markdown-module.rb \
            --candidate "${FORMULA_PATH}" \
            --url "${ARCHIVE_URL}" \
            --sha256 "${ARCHIVE_SHA}" \
            --version "${CURRENT_VERSION}"
          brew audit --strict codex/formula-gate/nginx-markdown-module

      - name: Install local formula from source
        if: steps.identity.outputs.stable == 'true'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          FORMULA_PATH="$(brew --repository codex/formula-gate)/Formula/nginx-markdown-module.rb"
          if [[ ! -f "${FORMULA_PATH}" ]]; then
            echo "::error::rendered formula missing at ${FORMULA_PATH}" >&2
            exit 1
          fi
          # Homebrew 7 refuses absolute formula paths in install ('Invalid
          # tap name'), so install through the tap-qualified name, which
          # resolves to the same rendered file the audit step verified.
          brew install --build-from-source codex/formula-gate/nginx-markdown-module

      - name: Run formula test
        if: steps.identity.outputs.stable == 'true'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew test codex/formula-gate/nginx-markdown-module
