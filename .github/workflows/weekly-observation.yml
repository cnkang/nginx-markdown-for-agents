name: Weekly Observation

on:
  schedule:
    - cron: '0 5 * * 1'  # 05:00 UTC every Monday
  workflow_dispatch:

permissions: {}

jobs:
  weekly-fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_FUZZ_VERSION: 0.13.1
    strategy:
      fail-fast: false
      matrix:
        target: [parser_html, ffi_convert, security_validator, fuzz_streaming_no_panic, fuzz_streaming_chunk_split, fuzz_streaming_malformed, fuzz_decompression, fuzz_url_validation, convert_html, streaming_chunks, negotiation_and_headers, fuzz_encoding_chain, fuzz_multilayer_decode, fuzz_trusted_proxy_cidr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            components/rust-converter -> target
          cache-bin: false

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked

      - name: Run weekly fuzz target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          cd components/rust-converter
          cargo +nightly fuzz run "${FUZZ_TARGET}" -- -max_total_time=3600

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-fuzz-${{ matrix.target }}
          path: |
            components/rust-converter/fuzz/artifacts
            components/rust-converter/fuzz/corpus
          if-no-files-found: ignore
          retention-days: 30

  weekly-soak:
    name: Soak Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUST_TARGET: x86_64-unknown-linux-gnu
      RUST_FEATURES: streaming,incremental,prune_noise_regions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-gnu

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apache2-utils binutils build-essential ca-certificates curl \
            libbrotli-dev libpcre2-dev pkg-config tar zlib1g-dev
          python3 -m pip install -r requirements-dev.txt -r requirements-perf.txt

      - name: Build module-enabled NGINX
        run: |
          set -euo pipefail
          nginx_version="$(python3 - <<'PY'
          import json
          import re

          with open("release/performance/canonical-environment.json", encoding="utf-8") as handle:
              environment = json.load(handle)
          if environment.get("runner") != "ubuntu-24.04":
              raise SystemExit("canonical soak runner does not match ubuntu-24.04")
          if environment.get("architecture") != "x86_64":
              raise SystemExit("canonical soak architecture does not match x86_64")
          version = environment.get("nginx_version")
          if not isinstance(version, str) or not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+", version
          ):
              raise SystemExit("canonical soak NGINX version is invalid")
          print(version)
          PY
          )"
          buildroot="${RUNNER_TEMP}/nginx-weekly-soak-${nginx_version}"
          nginx_src="${buildroot}/src"
          mkdir -p "${nginx_src}"

          cargo build --locked --release --target "${RUST_TARGET}" \
            --features "${RUST_FEATURES}" \
            --config profile.release.lto=false \
            --manifest-path components/rust-converter/Cargo.toml

          if ! command -v cbindgen >/dev/null 2>&1 \
              || [[ "$(cbindgen --version)" != "cbindgen 0.29.2" ]]; then
            cargo install cbindgen --version 0.29.2 --locked
          fi
          mkdir -p components/rust-converter/include
          cbindgen --quiet \
            --config components/rust-converter/cbindgen.toml \
            --crate nginx-markdown-converter \
            --output components/rust-converter/include/markdown_converter.h
          python3 tools/harness/normalize_cbindgen_header.py
          cp components/rust-converter/include/markdown_converter.h \
            components/nginx-module/src/markdown_converter.h
          make check-headers
          git diff --exit-code -- \
            components/rust-converter/include/markdown_converter.h \
            components/nginx-module/src/markdown_converter.h

          tarball="${buildroot}/nginx-${nginx_version}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o "${tarball}" \
            "https://nginx.org/download/nginx-${nginx_version}.tar.gz"
          packaging/scripts/verify-checksum.sh \
            -f "${tarball}" \
            -i "nginx-${nginx_version}"
          tar -xzf "${tarball}" -C "${nginx_src}" --strip-components=1

          (
            cd "${nginx_src}"
            export NGX_MARKDOWN_RUST_FEATURES="${RUST_FEATURES}"
            ./configure \
              --with-compat \
              --prefix="${buildroot}/runtime" \
              --modules-path="${buildroot}/runtime/modules" \
              --add-dynamic-module="${GITHUB_WORKSPACE}/components/nginx-module"
            make -j"$(nproc)" modules
            make -j"$(nproc)"
          )

          nginx_bin="${nginx_src}/objs/nginx"
          module_so="${nginx_src}/objs/ngx_http_markdown_filter_module.so"
          [[ -x "${nginx_bin}" ]] || { echo "NGINX binary missing" >&2; exit 1; }
          [[ -f "${module_so}" ]] || { echo "NGINX module missing" >&2; exit 1; }
          {
            echo "NGINX_BIN=${nginx_bin}"
            echo "MODULE_SO=${module_so}"
            echo "WEEKLY_SOAK_BUILDROOT=${buildroot}"
          } >> "${GITHUB_ENV}"
        shell: bash

      - name: Generate candidate-bound soak manifest
        run: |
          python3 tools/release/gates/generate_soak_scenario_manifest.py \
            --candidate-sha "$(git rev-parse HEAD)" \
            --version 0.9.2
        shell: bash

      - name: Probe module loadability
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT
          printf 'load_module %s;\nevents {}\nhttp {}\n' \
            "${MODULE_SO}" > "${probe_dir}/nginx.conf"
          "${NGINX_BIN}" -t -q -p "${probe_dir}" -c nginx.conf
        shell: bash

      - name: Run soak qualification gate
        run: |
          set -euo pipefail
          test -x "${NGINX_BIN}"
          test -f "${MODULE_SO}"
          make test-e2e-rust-soak
        shell: bash

      - name: Remove weekly soak build artifacts
        if: always()
        run: |
          if [[ -n "${WEEKLY_SOAK_BUILDROOT:-}" && -d "${WEEKLY_SOAK_BUILDROOT}" ]]; then
            rm -rf "${WEEKLY_SOAK_BUILDROOT}"
          fi
        shell: bash

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-soak
          path: |
            artifacts/release/0.9.2/short-soak-scenario-manifest.json
            artifacts/release/0.9.2/soak-qualification-record.json
            build/soak-runtime
          if-no-files-found: warn
          retention-days: 30

  weekly-perf:
    name: Weekly Performance Regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Install performance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apache2-utils
          python3 -m pip install -r requirements-dev.txt -r requirements-perf.txt

      - name: Run performance evidence gate (report-oriented)
        run: make perf-evidence-check
        shell: bash
