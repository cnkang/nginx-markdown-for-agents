# Reason Registry — Single Declarative Source of Truth
#
# This file is the sole authoritative registry for all reason codes in the
# nginx-markdown-for-agents module. It implements the four-dimensional taxonomy
# defined in Requirement 6 (Canonical Reason and Error Model):
#
#   Outcome x Stage x Reason x ErrorOrigin
#
# Outcome is determined at runtime decision time (not statically bound here).
# Each entry defines: discriminant, key, default_stage, allowed_origins,
# operator_visible, outcome (static terminal classification), and
# default_origin (static fallback origin; runtime origin passthrough
# is a 1.x enhancement).
#
# A build-time generator reads this file and produces:
#   - components/rust-converter/src/decision/reason_code.rs (Rust enum + metadata)
#   - components/nginx-module/src/markdown_reason_meta.h (C reason metadata table)
#   - Metrics label arrays
#   - Diagnostics field mappings
#   - Count/hash manifest
#
# DO NOT hand-edit reason_code.rs — it is generated output from this file.
# DO NOT derive registry data by regex-parsing Rust enum or match arms.

[metadata]
schema_version = 1
description = "Canonical reason code registry for nginx-markdown-for-agents"
generator = "tools/reason-codegen/generate.py"

# Taxonomy dimensions (reference)
# Outcome (5): converted, skipped, failed_open, failed_closed, aborted
# Stage (8): eligibility, decompression, parsing, conversion, precommit, postcommit, delivery, dynconf
# ErrorOrigin (8): allocation, downstream, invariant, format, truncated, timeout, memory_budget, internal

# --- Success ---

[[reasons]]
discriminant = 0
key = "converted"
default_stage = "conversion"
allowed_origins = []
operator_visible = true
outcome = "converted"
default_origin = "none"

