# Default values for nginx-markdown chart

replicaCount: 1

# The runtime image is intentionally NOT defaulted: this chart has no
# stock-runtime contract (the documented "installable with a stock nginx
# image" applies only to local smoke with explicit overrides).  Helm
# refuses to render the Deployment until image.repository and either
# image.tag or image.digest are set explicitly, e.g.:
#   --set image.repository=nginx --set image.tag=1.26.3
# or the markdown-enabled image your release provides.
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""
  # An immutable digest takes precedence over tag when both are set.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Optional user-managed volumes for custom images or deployments.
extraVolumes: []
extraVolumeMounts: []

# Health check probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Graceful shutdown contract (0.9.2): NGINX master drains in-flight requests
# on SIGQUIT.  The default preStop sends SIGQUIT to the container's nginx
# master so a rolled-out pod finishes its in-flight conversions instead of
# being killed mid-stream.  terminationGracePeriodSeconds bounds the total
# drain window; raise it for long-running streaming conversions.  Override
# lifecycle entirely (set to {}) when using a non-nginx entrypoint.
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "kill -QUIT $(cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null || true"]

# NGINX Markdown module configuration
markdown:
  # Disabled by default so the chart can run with a stock NGINX image.
  # To enable the module, use an image that already contains
  # ngx_http_markdown_filter_module.so and set loadModule to its path.
  enabled: false
  onError: "pass"
  flavor: "commonmark"
  tokenEstimate: false
  # Cache validation mode: off | ims_only | full
  conditionalRequests: "ims_only"
  logVerbosity: "info"
  autoDecompress: true

  # Absolute load_module path inside the container, for example:
  # /usr/lib/nginx/modules/ngx_http_markdown_filter_module.so
  loadModule: ""

  # Streaming configuration
  streaming:
    # Processing-path policy: off | auto | force
    mode: "auto"

  # Noise pruning
  prune:
    noise: true
    selectors: ""
    protectionSelectors: ""

  # Content-type routing
  contentTypes: []

  # markdown_limits keys (all optional; empty values are omitted from the
  # rendered config; when every key is empty the directive is not emitted at
  # all and the module's frozen 0.9.2 defaults apply:
  # conversion_memory=64m, conversion_timeout=30s, streaming_buffer=2m,
  # parser_memory=32m, parser_timeout=10s, decompressed_size=10m,
  # decompression_ratio=100, max_inflight=64)
  limits:
    # The chart exposes only the canonical markdown_limits vocabulary.
    conversionMemory: ""
    conversionTimeout: ""
    # streamingBuffer: "2m"
    # parserMemory: "32m"
    # parserTimeout: "10s"
    # decompressedSize: "10m"
    # decompressionRatio: 100
    # maxInflight: 64

# Metrics endpoint
metrics:
  # Requires markdown.enabled=true because markdown_metrics* directives are
  # provided by the markdown module.
  enabled: false
  uri: "/_markdown_metrics"
  shmSize: "8m"
  # When sidecar.enabled=true the chart adds a metrics-scraper sidecar
  # container that fetches the loopback-only metrics endpoint and serves it
  # on a separate port, so Prometheus scraping does not require the module
  # to accept non-loopback connections (Rule 13: loopback-only module).
  sidecar:
    enabled: false
    image:
      # No mutable image default. Set digest (preferred) or an explicit tag
      # when the sidecar is enabled.
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    port: 9113
    resources: {}
