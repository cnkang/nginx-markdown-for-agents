# Default values for nginx-markdown chart

replicaCount: 1

# The runtime image is intentionally NOT defaulted: this chart has no
# stock-runtime contract (the documented "installable with a stock nginx
# image" applies only to local smoke with explicit overrides).  Helm
# refuses to render the Deployment until BOTH image.repository and
# image.tag are set explicitly, e.g.:
#   --set image.repository=nginx --set image.tag=1.26.3
# or the markdown-enabled image your release provides.
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Optional user-managed volumes for custom images or deployments.
extraVolumes: []
extraVolumeMounts: []

# Health check probes
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# NGINX Markdown module configuration
markdown:
  # Disabled by default so the chart can run with a stock NGINX image.
  # To enable the module, use an image that already contains
  # ngx_http_markdown_filter_module.so and set loadModule to its path.
  enabled: false
  maxSize: "10m"
  timeout: "5s"
  onError: "pass"
  flavor: "commonmark"
  tokenEstimate: false
  etag: true
  # Cache validation mode: off | ims_only | full
  conditionalRequests: "ims_only"
  logVerbosity: "info"
  autoDecompress: true

  # Absolute load_module path inside the container, for example:
  # /usr/lib/nginx/modules/ngx_http_markdown_filter_module.so
  loadModule: ""

  # Streaming configuration
  streaming:
    # Processing-path policy: off | auto | force
    mode: "auto"
    budget: "2m"

  # Noise pruning
  prune:
    noise: true
    selectors: ""
    protectionSelectors: ""

  # Content-type routing
  contentTypes: []

  # markdown_limits keys (all optional; omitted keys keep module defaults)
  limits:
    # conversionMemory: "10m"
    # conversionTimeout: "5s"
    # parserMemory: "32m"
    # parserTimeout: "10s"
    # streamingBuffer: "2m"
    # decompressedSize: "64m"
    # decompressionRatio: 100
    # maxInflight: 64
    {}

# Metrics endpoint
metrics:
  # Requires markdown.enabled=true because markdown_metrics* directives are
  # provided by the markdown module.
  enabled: false
  uri: "/_markdown_metrics"
  shmSize: "8m"
  # When sidecar.enabled=true the chart adds a metrics-scraper sidecar
  # container that fetches the loopback-only metrics endpoint and serves it
  # on a separate port, so Prometheus scraping does not require the module
  # to accept non-loopback connections (Rule 13: loopback-only module).
  sidecar:
    enabled: false
    image:
      # No mutable image default. Set digest (preferred) or an explicit tag
      # when the sidecar is enabled.
      repository: ""
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent
    port: 9113
    resources: {}
