apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-markdown.fullname" . }}-config
  labels:
    {{- include "nginx-markdown.labels" . | nindent 4 }}
data:
  # The chart is an opinionated, bounded ConfigMap surface. It renders only
  # the values documented in values.yaml; other 0.9.2 module directives are
  # intentionally left to a deployment-supplied nginx.conf rather than being
  # silently inferred or emitted here.
  nginx.conf: |
    {{- if and .Values.markdown.enabled (not .Values.markdown.loadModule) }}
    {{- fail "markdown.loadModule is required when markdown.enabled=true; use an image containing ngx_http_markdown_filter_module.so and set the in-container module path" }}
    {{- end }}
    {{- if and .Values.metrics.enabled (not .Values.markdown.enabled) }}
    {{- fail "metrics.enabled=true requires markdown.enabled=true because metrics directives are provided by the markdown module" }}
    {{- end }}
    {{- if and .Values.metrics.enabled (not .Values.metrics.sidecar.enabled) }}
    {{- fail "metrics.enabled=true requires metrics.sidecar.enabled=true: the module's metrics endpoint is loopback-only, so Prometheus can only scrape through the in-pod sidecar proxy" }}
    {{- end }}
    {{- if and .Values.metrics.enabled .Values.metrics.sidecar.enabled (eq (int .Values.metrics.sidecar.port) (int .Values.service.port)) }}
    {{- fail "metrics.sidecar.port must differ from service.port to avoid a metrics sidecar/listener port collision" }}
    {{- end }}
    {{- if and .Values.markdown.enabled .Values.markdown.loadModule }}
    load_module {{ .Values.markdown.loadModule }};
    {{- end }}
    worker_processes auto;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /var/cache/nginx/client_body_temp;
      proxy_temp_path /var/cache/nginx/proxy_temp;
      fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
      uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
      scgi_temp_path /var/cache/nginx/scgi_temp;
      {{- if and .Values.markdown.enabled .Values.metrics.enabled }}
      markdown_metrics_shm_size {{ .Values.metrics.shmSize }};
      {{- end }}
      server {
        listen 8080;
        {{- if .Values.markdown.enabled }}
        markdown_filter on;
        {{- if or .Values.markdown.limits.conversionMemory .Values.markdown.limits.conversionTimeout .Values.markdown.limits.streamingBuffer .Values.markdown.limits.parserMemory .Values.markdown.limits.parserTimeout .Values.markdown.limits.decompressedSize .Values.markdown.limits.decompressionRatio .Values.markdown.limits.maxInflight }}
        markdown_limits{{- if .Values.markdown.limits.conversionMemory }} conversion_memory={{ .Values.markdown.limits.conversionMemory }}{{- end }}{{- if .Values.markdown.limits.conversionTimeout }} conversion_timeout={{ .Values.markdown.limits.conversionTimeout }}{{- end }}{{- if .Values.markdown.limits.streamingBuffer }} streaming_buffer={{ .Values.markdown.limits.streamingBuffer }}{{- end }}{{- if .Values.markdown.limits.parserMemory }} parser_memory={{ .Values.markdown.limits.parserMemory }}{{- end }}{{- if .Values.markdown.limits.parserTimeout }} parser_timeout={{ .Values.markdown.limits.parserTimeout }}{{- end }}{{- if .Values.markdown.limits.decompressedSize }} decompressed_size={{ .Values.markdown.limits.decompressedSize }}{{- end }}{{- if .Values.markdown.limits.decompressionRatio }} decompression_ratio={{ .Values.markdown.limits.decompressionRatio }}{{- end }}{{- if .Values.markdown.limits.maxInflight }} max_inflight={{ .Values.markdown.limits.maxInflight }}{{- end }};
        {{- end }}
        markdown_error_policy {{ .Values.markdown.onError }};
        markdown_flavor {{ .Values.markdown.flavor }};
        {{- if .Values.markdown.tokenEstimate }}
        markdown_token_estimate on;
        {{- end }}
        markdown_auto_decompress {{ ternary "on" "off" .Values.markdown.autoDecompress }};
        markdown_cache_validation {{ .Values.markdown.conditionalRequests }};
        markdown_log_verbosity {{ .Values.markdown.logVerbosity }};
        {{- if .Values.markdown.streaming }}
        markdown_streaming {{ .Values.markdown.streaming.mode }};
        {{- end }}
        {{- if .Values.markdown.prune }}
        markdown_prune_noise {{ ternary "on" "off" .Values.markdown.prune.noise }};
        {{- if .Values.markdown.prune.selectors }}
        markdown_prune_selectors "{{ .Values.markdown.prune.selectors | replace "\\" "\\\\" | replace "\"" "\\\"" }}";
        {{- end }}
        {{- if .Values.markdown.prune.protectionSelectors }}
        markdown_prune_protection_selectors "{{ .Values.markdown.prune.protectionSelectors | replace "\\" "\\\\" | replace "\"" "\\\"" }}";
        {{- end }}
        {{- end }}
        {{- if .Values.markdown.contentTypes }}
        markdown_content_types {{ join " " .Values.markdown.contentTypes }};
        {{- end }}
        {{- end }}
        location / {
          root /usr/share/nginx/html;
        }
        {{- if and .Values.markdown.enabled .Values.metrics.enabled }}
        location = {{ .Values.metrics.uri }} {
          markdown_metrics;
        }
        {{- end }}
      }
    }
  {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
  metrics-sidecar.conf: |
    # Metrics sidecar: proxies the loopback-only module metrics endpoint to
    # a separate port so Prometheus can scrape without the module accepting
    # non-loopback connections.  Containers in the same Pod share the
    # network namespace, so 127.0.0.1 reaches the module with a loopback
    # source address and passes the module's access check.
    worker_processes 1;
    pid /var/run/metrics-sidecar.pid;
    events { worker_connections 256; }
    http {
      access_log off;
      client_body_temp_path /var/cache/nginx/metrics-sidecar/client_body_temp;
      proxy_temp_path /var/cache/nginx/metrics-sidecar/proxy_temp;
      fastcgi_temp_path /var/cache/nginx/metrics-sidecar/fastcgi_temp;
      uwsgi_temp_path /var/cache/nginx/metrics-sidecar/uwsgi_temp;
      scgi_temp_path /var/cache/nginx/metrics-sidecar/scgi_temp;
      server {
        listen {{ .Values.metrics.sidecar.port }};
        location /metrics {
          proxy_pass http://127.0.0.1:8080{{ .Values.metrics.uri }};
        }
        location = /healthz {
          return 200 "ok\n";
        }
      }
    }
  {{- end }}
