apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-markdown.fullname" . }}
  labels:
    {{- include "nginx-markdown.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
    - port: {{ .Values.metrics.sidecar.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "nginx-markdown.selectorLabels" . | nindent 4 }}
