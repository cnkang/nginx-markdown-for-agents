apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nginx-markdown.fullname" . }}
  labels:
    {{- include "nginx-markdown.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nginx-markdown.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Config changes must roll the pods; without a checksum annotation,
        # helm upgrade updates the ConfigMap but leaves the running Pod on
        # the old rendered nginx.conf.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "nginx-markdown.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nginx-markdown.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $imageRepo := required "image.repository must be set explicitly (no default runtime image)" .Values.image.repository }}
          {{- $imageDigest := .Values.image.digest | default "" }}
          {{- $imageTag := .Values.image.tag | default "" }}
          {{- if contains "@" $imageRepo }}
          image: "{{ $imageRepo }}"
          {{- else if $imageDigest }}
          image: "{{ $imageRepo }}@{{ $imageDigest }}"
          {{- else }}
          {{- if eq $imageTag "" }}
          {{- fail "image.tag or image.digest must be set explicitly (no default runtime image)" }}
          {{- end }}
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
        - name: metrics-sidecar
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $sidecarImageRepo := required "metrics.sidecar.image.repository must be set when the metrics sidecar is enabled" .Values.metrics.sidecar.image.repository }}
          {{- $sidecarImageDigest := .Values.metrics.sidecar.image.digest | default "" }}
          {{- $sidecarImageTag := .Values.metrics.sidecar.image.tag | default "" }}
          {{- if contains "@" $sidecarImageRepo }}
          image: "{{ $sidecarImageRepo }}"
          {{- else if $sidecarImageDigest }}
          image: "{{ $sidecarImageRepo }}@{{ $sidecarImageDigest }}"
          {{- else }}
          {{- if eq $sidecarImageTag "" }}
          {{- fail "metrics.sidecar.image.digest or metrics.sidecar.image.tag must be set when the metrics sidecar is enabled" }}
          {{- end }}
          image: "{{ $sidecarImageRepo }}:{{ $sidecarImageTag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.metrics.sidecar.image.pullPolicy }}
          volumeMounts:
            - name: metrics-sidecar-config
              mountPath: /etc/nginx/nginx.conf
              subPath: metrics-sidecar.conf
            - name: metrics-sidecar-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: metrics-sidecar-cache
              mountPath: /var/cache/nginx/metrics-sidecar
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.sidecar.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              # End-to-end via the sidecar proxy: the module is loopback-only,
              # so probing /metrics verifies the full scrape path (sidecar ->
              # 127.0.0.1:8080/_markdown_metrics).  The module returning 502
              # (or the sidecar failing) leaves the pod unready.
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.metrics.sidecar.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "nginx-markdown.fullname" . }}-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
        - name: metrics-sidecar-run
          emptyDir: {}
        {{- end }}
        - name: nginx-tmp
          emptyDir: {}
        {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
        - name: metrics-sidecar-config
          configMap:
            name: {{ include "nginx-markdown.fullname" . }}-config
        {{- end }}
        {{- if and .Values.markdown.enabled .Values.metrics.enabled .Values.metrics.sidecar.enabled }}
        - name: metrics-sidecar-cache
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
