# Pre-commit hooks for nginx-markdown-for-agents
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Rust formatting and linting
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: make rust-fmt-check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: make rust-clippy-check
        language: system
        types: [rust]
        pass_filenames: false
  # Shell script quality
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x, --severity=warning]
  # Version consistency
  - repo: local
    hooks:
      - id: version-consistency
        name: version consistency check
        entry: tools/harness/detect_version_consistency.sh
        language: script
        pass_filenames: false
        files: ^(components/rust-converter/Cargo\.toml|charts/nginx-markdown/Chart\.yaml|components/rust-converter/fuzz/Cargo\.toml|tools/corpus/test-corpus-conversion/Cargo\.toml|docs/guides/INSTALLATION\.md)$
  # FFI header synchronization
  - repo: local
    hooks:
      - id: ffi-header-sync
        name: FFI header synchronization
        entry: make check-headers
        language: system
        pass_filenames: false
        files: ^components/rust-converter/src/ffi/
  # C code quality
  - repo: local
    hooks:
      - id: detect-pool-free
        name: detect pool/free mismatch
        entry: tools/harness/detect_pool_free.sh
        language: script
        files: ^components/nginx-module/src/.*\.c$
      - id: detect-backpressure-resume
        name: detect backpressure resume patterns
        entry: tools/harness/detect_backpressure_resume.sh
        language: script
        pass_filenames: false
        files: ^components/nginx-module/src/.*\.c$
      - id: detect-decompression-budget
        name: detect decompression budget enforcement
        entry: tools/harness/detect_decompression_budget.sh
        language: script
        pass_filenames: false
        files: ^components/nginx-module/src/.*decomp.*\.c$

  # Write-time hygiene gates (2026-08-21 remediation, Rules 61/63/70/13)
  - repo: local
    hooks:
      - id: detect-scratch-files
        name: scratch/temporary file hygiene (Rule 70)
        entry: python3 tools/harness/detect_scratch_files.py --staged
        language: system
        pass_filenames: false
      - id: baseline-hand-edit
        name: performance baseline binding lifecycle (Rule 61)
        entry: python3 tools/harness/detect_baseline_hand_edit.py --changed
        language: system
        pass_filenames: true
        files: ^perf/baselines/.*\.json$
      - id: workflow-env-liveness
        name: workflow env-var liveness (Rule 13)
        entry: python3 tools/harness/detect_workflow_env_liveness.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
      - id: docs-style-changed
        name: docs writing style, changed files (Rule 63)
        entry: python3 tools/docs/check_writing_style.py --changed --base HEAD
        language: system
        pass_filenames: false
        files: \.md$
  # Rust FFI safety
  - repo: local
    hooks:
      - id: detect-ffi-fat-pointer
        name: detect FFI fat pointer transfer
        entry: tools/harness/detect_ffi_fat_pointer_transfer.sh
        language: script
        pass_filenames: false
        files: ^components/rust-converter/src/ffi/.*\.rs$
      - id: detect-ffi-panic-safety
        name: detect FFI panic safety
        entry: tools/harness/detect_ffi_panic_safety.sh
        language: script
        pass_filenames: false
        files: ^components/rust-converter/src/ffi/.*\.rs$

  # Helm templates contain Go-template directives and are not standalone YAML.
  # Validate them through Helm rather than the generic YAML parser below.
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm chart lint
        entry: helm lint charts/nginx-markdown --set image.repository=nginx --set image.tag=1.28.2
        language: system
        pass_filenames: false
        files: ^charts/nginx-markdown/

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Retained benchmark evidence is byte-bound to its recorded digest
        # (Rule 61); reformatting it would invalidate provenance.  Fix the
        # generator and re-finalize the baseline instead.
        # Fuzz corpus entries are also byte-exact inputs; never rewrite them.
        exclude: ^(perf/baselines/.*-raw-probes/|components/rust-converter/fuzz/corpus/)
      - id: end-of-file-fixer
        # Same Rule 61 evidence-binding exclusion as trailing-whitespace.
        # Fuzz corpus entries are also byte-exact inputs; never rewrite them.
        exclude: ^(perf/baselines/.*-raw-probes/|components/rust-converter/fuzz/corpus/)
      - id: check-yaml
        exclude: ^charts/nginx-markdown/templates/
      - id: check-added-large-files
      - id: check-merge-conflict
