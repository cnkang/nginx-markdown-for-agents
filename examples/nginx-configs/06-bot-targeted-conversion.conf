# Bot-Targeted Markdown Conversion
#
# Serve Markdown to specific AI crawlers and agent bots based on User-Agent,
# while keeping HTML for browsers and all other clients.
#
# Why this pattern exists:
#   Most AI bots (ClaudeBot, GPTBot, etc.) do not send Accept: text/markdown.
#   They use standard browser-like Accept headers. This configuration enables
#   the module for matching bots and uses markdown_accept force for that scope.
#
# Benefits:
#   - No application or module code changes required.
#   - Bot list is managed entirely through NGINX configuration.
#   - All standard eligibility checks (status, content type, size) still apply.
#   - Non-matching clients are completely unaffected.
#
# Customize:
#   - Replace example.com with your domain
#   - Replace 127.0.0.1:8080 with your backend address
#   - Add or remove User-Agent patterns in the map blocks below

load_module modules/ngx_http_markdown_filter_module.so;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- Bot detection: enable Markdown for known AI bots ---
    map $http_user_agent $is_ai_bot {
        default         off;
        "~*ClaudeBot"   on;
        "~*GPTBot"      on;
        "~*Google-Extended"  on;
        "~*Googlebot"   on;
        "~*Bytespider"  on;
        "~*CCBot"       on;
        "~*ChatGPT-User" on;
        "~*cohere-ai"   on;
        "~*PerplexityBot" on;
    }

    # --- Optional: also gate the filter itself per bot ---
    # Uncomment the following block if you want the module disabled entirely
    # for non-bot traffic (saves filter overhead for normal requests).
    #
    # map $http_user_agent $is_ai_bot {
    #     default         0;
    #     "~*ClaudeBot"   1;
    #     "~*GPTBot"      1;
    #     "~*Google-Extended"  1;
    #     "~*Googlebot"   1;
    #     "~*Bytespider"  1;
    #     "~*CCBot"       1;
    #     "~*ChatGPT-User" 1;
    #     "~*cohere-ai"   1;
    #     "~*PerplexityBot" 1;
    # }

    # Module defaults
    markdown_error_policy pass;
    markdown_limits conversion_memory=10m conversion_timeout=5s parser_timeout=5s parser_memory=10m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/markdown
               application/json application/javascript application/xml;

    upstream backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name example.com;

        location / {
            # Non-bot requests skip the filter entirely.
            markdown_filter $is_ai_bot;
            markdown_accept force;

            # Bot and non-bot responses differ (Markdown vs HTML).  If you
            # enable a shared cache, include the actual bot-classification
            # input ($is_ai_bot, or an equivalent canonical variable) in
            # proxy_cache_key so bot and normal-client responses cannot
            # share cached representations. Do not rely on Vary: Accept
            # alone — the module may convert even without a Markdown Accept
            # header when markdown_accept force is used.
            proxy_set_header Host $host;
            proxy_pass http://backend;
        }

        # Exclude API and static assets
        location /api/ {
            markdown_filter off;
            proxy_pass http://backend;
        }

        location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
            markdown_filter off;
            expires 30d;
            proxy_pass http://backend;
        }

        # Metrics (localhost only)
        location /markdown-metrics {
            markdown_metrics;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
