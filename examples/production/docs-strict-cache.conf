# Documentation site — explicit strict-cache preset
# Settings: full ETag and conditional-request support
# Features: cache_validation full, ETag generation, If-None-Match 304
#
# Verify with the module-enabled wrapper:
#   NGINX_BIN=/path/to/nginx MODULE_SO=/path/to/ngx_http_markdown_filter_module.so \
#     tools/e2e/verify_examples_nginx_t.sh
# Test:   curl -H "Accept: text/markdown" http://localhost/docs/
# 304:    curl -H "Accept: text/markdown" -H 'If-None-Match: W/"..."' http://localhost/docs/
#
# MODULE LOAD: this complete configuration template uses markdown_* directives,
# so the dynamic module must be loaded before the http block with the
# deployment-specific module path, e.g.:
#   load_module /usr/lib64/nginx/modules/ngx_http_markdown_filter_module.so;
# The line below is a portable hint only; the verification wrapper injects
# MODULE_SO into a tested copy when it is set.

# load_module modules/ngx_http_markdown_filter_module.so;

worker_processes auto;
events {}

http {
    markdown_trusted_proxies 10.0.0.0/8;

    # Replace with your documentation origin service.
    upstream upstream_docs {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name docs.example.com;

        location / {
            proxy_pass http://upstream_docs;
            markdown_filter on;
            markdown_cache_validation full;
            # Strict caching: every response is validated and served from
            # the full-buffer path; no streaming.
            markdown_streaming off;
            markdown_limits conversion_memory=128m conversion_timeout=10s max_inflight=32;
            markdown_error_policy pass;
            gzip on;
            gzip_types text/markdown;
        }

        location /markdown-metrics {
            markdown_metrics;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location /nginx-markdown/diagnostics {
            markdown_diagnostics on;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
