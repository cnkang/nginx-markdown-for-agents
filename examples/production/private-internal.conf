# Internal documentation server — private network
# Settings: explicit balanced policies with auth_basic access control
# Features: auth_basic, trusted proxies, restricted metrics
#
# Verify: nginx -t -c /path/to/private-internal.conf
# SECURITY: A co-located TLS terminator is mandatory. It is the only
# client-facing endpoint and forwards to this loopback-only listener.
# Test:   curl -u admin:pass -H "Accept: text/markdown" https://internal.example.local/internal/
# ETag:   curl -u admin:pass -H "Accept: text/markdown" -H 'If-None-Match: "abc"' https://internal.example.local/internal/
#
# MODULE LOAD: this standalone configuration uses markdown_* directives,
# so the dynamic module must be loaded from the main configuration
# (nginx.conf, before the http block) with the deployment-specific
# module path, e.g.:
#   load_module /usr/lib64/nginx/modules/ngx_http_markdown_filter_module.so;
# The line below is a portable hint only; uncomment and adjust the path
# when running this file as the main configuration.

# load_module modules/ngx_http_markdown_filter_module.so;

worker_processes auto;
events {}

http {
    markdown_trusted_proxies 192.168.0.0/16 10.0.0.0/8;

    # Replace with your private documentation origin service.
    upstream upstream_internal {
        server 127.0.0.1:8082;
    }

    # A co-located TLS terminator is mandatory.
    server {
        listen 127.0.0.1:8080;
        server_name internal.example.local;

        location / {
            auth_basic "Internal Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://upstream_internal;
            markdown_filter on;
            markdown_limits conversion_memory=64m conversion_timeout=5s parser_timeout=5s max_inflight=32;
            markdown_error_policy pass;
            markdown_cache_validation full;
            # Internal docs are small and private: full-buffer path only.
            markdown_streaming off;
        }

        # Metrics endpoint restricted to local administrative access.
        # Note: If this server is behind a local reverse proxy on 127.0.0.1,
        # replace allow 127.0.0.1 with auth_basic or a dedicated management port
        # so external clients cannot spoof loopback access.
        location /markdown-metrics {
            markdown_metrics;
            # Loopback allowlist alone is bypassable by a co-located
            # reverse proxy; require credentials in addition.
            auth_basic "Internal Metrics";
            auth_basic_user_file /etc/nginx/.htpasswd;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # Diagnostics endpoint restricted to local administrative access.
        # Note: If this server is behind a local reverse proxy on 127.0.0.1,
        # replace allow 127.0.0.1 with auth_basic or a dedicated management port.
        location /nginx-markdown/diagnostics {
            markdown_diagnostics on;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
