apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-markdown-config
data:
  # Do NOT mount this entry into /etc/nginx/nginx.conf's include tree or any
  # conf.d directory: a second load_module for the same module fails nginx -t.
  # Mount it only where the module path must be declared once.
  markdown-snippet.conf: |
    load_module modules/ngx_http_markdown_filter_module.so;
  markdown-filter.conf: |
    markdown_filter on;
    markdown_flavor gfm;
    markdown_auto_decompress on;
    markdown_limits decompressed_size=10m;
    markdown_streaming auto;
